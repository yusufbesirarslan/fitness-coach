AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AxisAI R6 release monitoring M1-M3: worker liveness (with a 60-minute
  escalation), RQ queue age and failed jobs, and FatSecret 24h provider-data
  expiry. Reads FitX/Runtime metrics published by app/services/release_monitoring.py
  (worker heartbeat thread + retention job). Alarms only: no IAM, no SNS
  subscription, no compute. NOT applied by the deploy pipeline; see README.md.

Parameters:
  AlarmTopicArn:
    Type: String
    AllowedPattern: '^arn:aws:sns:[a-z0-9-]+:[0-9]{12}:[A-Za-z0-9_-]+$'
    Description: >
      Existing SNS topic that already pages the founder (the one the
      AxisAI-EC2-* alarms notify). Read its ARN from an existing alarm's
      AlarmActions before deploying.
  EscalationTopicArn:
    Type: String
    AllowedPattern: '^arn:aws:sns:[a-z0-9-]+:[0-9]{12}:[A-Za-z0-9_-]+$'
    Description: >
      Topic for the 60-minute worker escalation. Must differ from
      AlarmTopicArn (enforced by the EscalationIsADifferentChannel rule),
      e.g. an SMS topic.
  Namespace:
    Type: String
    Default: FitX/Runtime
  ActionsEnabled:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: >
      Create with actions disabled, confirm every alarm reaches OK once the
      new worker publishes, then update with 'true' (README "Apply").

Conditions:
  Actions: !Equals [!Ref ActionsEnabled, 'true']

Rules:
  EscalationIsADifferentChannel:
    Assertions:
      - Assert: !Not [!Equals [!Ref EscalationTopicArn, !Ref AlarmTopicArn]]
        AssertDescription: >
          The 60-minute escalation must reach a different topic (channel) than
          the primary page, otherwise it is not an escalation.

Resources:
  # ── M1 worker liveness ────────────────────────────────────────────────────
  # One datapoint per minute while the worker heartbeat thread runs AND reaches
  # Redis. Missing data is breaching: dead worker, dead thread, Redis down,
  # metrics switched off or IAM broken all page identically.
  WorkerHeartbeatMissing:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: AxisAI-R6-M1-Worker-Heartbeat-Missing
      AlarmDescription: >
        M1: no worker heartbeat for 5 minutes. Runbook: infra/r6-release-monitoring/README.md#m1.
        Acknowledge in the incident log; if still in ALARM at 60 minutes the
        escalation alarm notifies the escalation topic.
      Namespace: !Ref Namespace
      MetricName: WorkerHeartbeat
      Dimensions: [{Name: Service, Value: worker}]
      Statistic: SampleCount
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 5
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      ActionsEnabled: !If [Actions, true, false]
      AlarmActions: [!Ref AlarmTopicArn]
      OKActions: [!Ref AlarmTopicArn]

  WorkerHeartbeatEscalation:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: AxisAI-R6-M1-Worker-Heartbeat-Escalation-60m
      AlarmDescription: >
        M1 escalation: worker heartbeat missing in 50 of the last 60 minutes
        (not resolved within the one-hour acknowledgement window; a worker
        that crash-loops with brief heartbeats still escalates).
      Namespace: !Ref Namespace
      MetricName: WorkerHeartbeat
      Dimensions: [{Name: Service, Value: worker}]
      Statistic: SampleCount
      Period: 60
      EvaluationPeriods: 60
      DatapointsToAlarm: 50
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      ActionsEnabled: !If [Actions, true, false]
      AlarmActions: [!Ref EscalationTopicArn]
      OKActions: [!Ref EscalationTopicArn]

  # ── M2 queue health ───────────────────────────────────────────────────────
  # The worker enqueues the retention pass every 300 s (ttl 300) and the
  # erasure retry hourly, so the queue carries work with zero user traffic.
  # Missing data is covered by M1, hence notBreaching here (no double page).
  #
  # Depth is the stuck-worker signal: QueueDepth is LLEN, which still counts
  # ids whose job hash expired (the retention pass is enqueued with ttl 300),
  # so a worker that stops consuming never lets it reach 0 again. A healthy
  # worker drains within seconds. The longest legitimate job is the erasure
  # retry (timeout 900 s), during which later enqueues wait, so the window is
  # 25 minutes: "never empty at any 1-minute sample for 25 minutes" is a hang
  # (or a sustained backlog, also worth a page).
  QueueNotDraining:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: AxisAI-R6-M2-Queue-Not-Draining
      AlarmDescription: >
        M2: the RQ queue was never empty for 25 minutes (worker alive but not
        consuming, or sustained backlog). Runbook: README.md#m2.
      Namespace: !Ref Namespace
      MetricName: QueueDepth
      Dimensions: [{Name: Service, Value: worker}]
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 5
      DatapointsToAlarm: 5
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: !If [Actions, true, false]
      AlarmActions: [!Ref AlarmTopicArn]
      OKActions: [!Ref AlarmTopicArn]

  # Age covers jobs without the short retention ttl (AI summaries, the hourly
  # erasure retry): a live job waiting 20 minutes (longer than the 900 s
  # erasure job it may legitimately queue behind) for 3 consecutive minutes.
  QueueOldestJobAge:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: AxisAI-R6-M2-Queue-Oldest-Job-Age
      AlarmDescription: >
        M2: a queued job has waited more than 1200 s for 3 minutes.
        Runbook: README.md#m2.
      Namespace: !Ref Namespace
      MetricName: QueueOldestJobAgeSeconds
      Dimensions: [{Name: Service, Value: worker}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 1200
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: !If [Actions, true, false]
      AlarmActions: [!Ref AlarmTopicArn]
      OKActions: [!Ref AlarmTopicArn]

  QueueFailedJobs:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: AxisAI-R6-M2-Queue-Failed-Jobs
      AlarmDescription: >
        M2: at least one RQ job exhausted its retries in the last 5 minutes
        (`flask rq-failed`). Runbook: README.md#m2.
      Namespace: !Ref Namespace
      MetricName: QueueFailedJobsNew
      Dimensions: [{Name: Service, Value: worker}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: !If [Actions, true, false]
      AlarmActions: [!Ref AlarmTopicArn]

  # ── M3 FatSecret 24h expiry ───────────────────────────────────────────────
  # Values are removed at 22h. A pass that has not completed for 30 minutes
  # still leaves >= 90 minutes before any value reaches 24h.
  ProviderRetentionPassMissing:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: AxisAI-R6-M3-FatSecret-Expiry-Pass-Missing
      AlarmDescription: >
        M3: no completed FatSecret retention pass for 30 minutes (normally
        every 5). Runbook: README.md#m3.
      Namespace: !Ref Namespace
      MetricName: ProviderRetentionPassCompleted
      Dimensions: [{Name: Service, Value: worker}]
      Statistic: SampleCount
      Period: 300
      EvaluationPeriods: 6
      DatapointsToAlarm: 6
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      ActionsEnabled: !If [Actions, true, false]
      AlarmActions: [!Ref AlarmTopicArn]
      OKActions: [!Ref AlarmTopicArn]

  ProviderRetentionOverdue:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: AxisAI-R6-M3-FatSecret-Values-Past-24h
      AlarmDescription: >
        M3: provider per-item values still present past the full 24h
        (licence boundary breached). Runbook: README.md#m3.
      Namespace: !Ref Namespace
      MetricName: ProviderRetentionOverdue
      Dimensions: [{Name: Service, Value: worker}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: !If [Actions, true, false]
      AlarmActions: [!Ref AlarmTopicArn]
      OKActions: [!Ref AlarmTopicArn]

Outputs:
  AlarmNames:
    Value: !Join
      - ','
      - - !Ref WorkerHeartbeatMissing
        - !Ref WorkerHeartbeatEscalation
        - !Ref QueueNotDraining
        - !Ref QueueOldestJobAge
        - !Ref QueueFailedJobs
        - !Ref ProviderRetentionPassMissing
        - !Ref ProviderRetentionOverdue
