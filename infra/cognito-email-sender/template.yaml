AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  AxisAI Cognito CustomEmailSender — Cognito'nun urettigi dogrulama/sifre
  sifirlama kodlarini markali AxisAI e-postalari olarak Resend uzerinden
  gonderen Lambda + KMS anahtari. Kullanici havuzuna baglama adimi manueldir
  (havuz konsol-yonetimli, IaC'de degil) — bkz. README.md runbook.

Parameters:
  ResendApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: >
      Resend API key. Bos birakilirsa Lambda calisir ama gonderim sessiz no-op
      olur (kod e-postalari HIC gitmez — trigger bagliyken bos birakma).
  UserPoolId:
    Type: String
    Default: eu-central-1_kaX0SORRK
    Description: Trigger'in baglanacagi mevcut Cognito kullanici havuzu.
  AppBaseUrl:
    Type: String
    Default: 'https://www.axisaiapp.com'
    Description: E-postalardaki CTA baglantilarinin tabani (/verify, /reset-password, ...).
  EmailFromName:
    Type: String
    Default: AxisAI
  EmailFromAddress:
    Type: String
    Default: noreply@mail.axisaiapp.com
    Description: Resend'de dogrulanmis gonderim domain'inde bir adres olmali.
  EmailReplyTo:
    Type: String
    Default: hello@axisaiapp.com
  AlarmEmail:
    Type: String
    Default: ''
    Description: >
      Alarm bildirimlerinin gidecegi e-posta (H5). Bos birakilirsa SNS konusu yine
      olusur ama ABONE OLMAZ - alarm calar, kimse duymaz. Deploy sonrasi gelen SNS
      onay e-postasini TIKLAMAYI unutma, yoksa abonelik aktiflesmez.

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]

Resources:
  # Cognito, CustomEmailSender koduna giden dogrulama/sifirlama kodunu bu
  # anahtar altinda (AWS Encryption SDK) sifreler; Lambda cozer.
  EmailKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: AxisAI Cognito CustomEmailSender code-encryption key
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountRootAdmin
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowCognitoEncrypt
            Effect: Allow
            Principal:
              Service: cognito-idp.amazonaws.com
            Action:
              - kms:CreateGrant
              - kms:Encrypt
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: '*'
            # Confused-deputy korumasi: yalnizca BU hesaptaki BU havuz.
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref 'AWS::AccountId'
              ArnLike:
                aws:SourceArn: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPoolId}'

  EmailKmsAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/axisai-cognito-email
      TargetKeyId: !Ref EmailKmsKey

  EmailSenderFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.handler
      Runtime: python3.12
      # x86_64 bilincli (landing stack'i arm64): aws-encryption-sdk yerel
      # 'cryptography' wheel'leri ceker; Windows gelistirme makinesinde
      # cross-arch derleme derdi yasamamak icin. Temiz kurulum icin README'deki
      # 'sam build --use-container' notuna bak.
      Architectures: [x86_64]
      # Cognito CustomEmailSender'i async cagirir ve sender hatasi API cagrisini
      # dusurmez — timeout kullanici deneyimini bekletmez. 5s/256MB prod'da
      # yetersiz cikti: aws-encryption-sdk + native cryptography importu dusuk
      # CPU'da (256MB) tek basina ~5s suruyor ve timeout sonrasi "suppressed
      # init" importu her invoke butcesinin icine geri itiyordu (sonsuz timeout
      # dongusu). 512MB daha fazla CPU verir; 20s de soguk zincire
      # (import + KMS decrypt + Resend TLS) rahat bir tavan birakir.
      Timeout: 20
      MemorySize: 512
      CodeUri: src/
      Environment:
        Variables:
          KMS_KEY_ARN: !GetAtt EmailKmsKey.Arn
          RESEND_API_KEY: !Ref ResendApiKey
          APP_BASE_URL: !Ref AppBaseUrl
          EMAIL_FROM_NAME: !Ref EmailFromName
          EMAIL_FROM_ADDRESS: !Ref EmailFromAddress
          EMAIL_REPLY_TO: !Ref EmailReplyTo
      Policies:
        - Statement:
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !GetAtt EmailKmsKey.Arn

  # Cognito'nun fonksiyonu cagirabilmesi icin izin — havuz ARN'ine kilitli.
  CognitoInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref EmailSenderFunction
      Principal: cognito-idp.amazonaws.com
      SourceAccount: !Ref 'AWS::AccountId'
      SourceArn: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPoolId}'

  # ─────────────────────────────────────────────────────────────────────────
  # H5 — SESSIZ BASARISIZLIK ALARMI.
  #
  # Trigger havuza baglandigi anda Cognito KENDI e-postalarini GONDERMEYI BIRAKIR.
  # Yani bu Lambda kirilirsa (bozuk RESEND_API_KEY, Resend kesintisi, KMS izin
  # kaymasi, aws-encryption-sdk surum atlamasi) dogrulama ve sifre-sifirlama
  # kodlari HICBIR kullaniciya ulasmaz — ama /register ve /forgot-password
  # nese icinde 200 donmeye devam eder. Kimse kayit olamaz, kimse sifresini
  # sifirlayamaz ve hicbir gosterge kirmizi yanmaz.
  #
  # DLQ NEDEN YOK: handler sozlesme geregi ASLA exception yukseltmez (bkz.
  # src/handler.py docstring) — bu dogru davranis, cunku e-posta hatasi Cognito
  # SignUp cagrisini dusurmemeli. Ama bunun bedeli: Lambda "basarili" gorunur ve
  # DLQ'ya hicbir sey dusmez. Yutulan istisna ASIL ariza modudur; dogru enstruman
  # bu yuzden LOG METRIC FILTER'dir.
  # ─────────────────────────────────────────────────────────────────────────

  EmailAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: AxisAI Cognito email-sender alarms

  EmailAlarmSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref EmailAlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  # Log grubunu BILEREK bir AWS::Logs::LogGroup kaynagi olarak TANIMLAMIYORUZ:
  # fonksiyon prod'da zaten calisti ve Lambda log grubunu OTOMATIK olusturdu;
  # simdi CFN ile tanimlamak "already exists" hatasiyla stack'i dusururdu.
  # Metric filter grubu ADIYLA referanslar (DependsOn: fonksiyon).
  #
  # Desen ASCII: Turkce karakterli mesaj metinlerine bagimli olmamak icin
  # Lambda Python runtime'inin seviye etiketlerini ([ERROR]/[WARNING]) ve
  # sessiz-devre-disi vakasinin tek isaretini (RESEND_API_KEY) yakalariz.
  #   [ERROR]         → handler._handle icinde yutulan istisna
  #   [WARNING]       → Resend gonderim hatasi / alici yok / sifreli kod yok
  #   RESEND_API_KEY  → "servis kapali" (anahtar yok) = kod e-postalari HIC gitmez
  # Log grubu yalnizca BU fonksiyona ait, dolayisiyla her ERROR/WARNING bizimdir.
  EmailFailureMetricFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn: EmailSenderFunction
    Properties:
      LogGroupName: !Sub '/aws/lambda/${EmailSenderFunction}'
      FilterPattern: '?"[ERROR]" ?"[WARNING]" ?"RESEND_API_KEY"'
      MetricTransformations:
        - MetricNamespace: AxisAI/CognitoEmail
          MetricName: EmailSendFailures
          MetricValue: '1'
          DefaultValue: 0

  EmailFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: axisai-cognito-email-failures
      AlarmDescription: >
        Cognito auth e-postasi (dogrulama/sifirlama) gonderilemedi. Trigger bagli
        oldugu icin Cognito yedek gondermez: kimse kayit olamiyor / sifre
        sifirlayamiyor olabilir. Lambda loglarinda [EMAIL-SENDER] satirlarina bak.
      Namespace: AxisAI/CognitoEmail
      MetricName: EmailSendFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      # Invoke yoksa metrik yoktur — bu bir ariza DEGILDIR (sessiz saatler).
      TreatMissingData: notBreaching
      AlarmActions: [!Ref EmailAlarmTopic]
      OKActions: [!Ref EmailAlarmTopic]

  # Lambda'nin KENDI hata metrikleri: handler yutsa da INIT asamasindaki hatalar
  # (import timeout / OOM — 256MB+5s ile bir kez yasandi, bkz. yukarisi) buraya
  # duser ve handler'a hic ulasmaz.
  EmailLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: axisai-cognito-email-lambda-errors
      AlarmDescription: >
        Lambda invoke hatasi (INIT timeout / OOM / runtime crash). Handler
        istisnalari yutar, dolayisiyla buradaki her hata handler'a ULASAMAYAN
        bir arizadir.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref EmailSenderFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref EmailAlarmTopic]

  EmailLambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: axisai-cognito-email-lambda-throttles
      AlarmDescription: Lambda throttle - auth e-postalari kuyruklanmadan DUSER.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref EmailSenderFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref EmailAlarmTopic]

Outputs:
  FunctionArn:
    Description: update-user-pool --lambda-config CustomEmailSender.LambdaArn degeri
    Value: !GetAtt EmailSenderFunction.Arn
  KmsKeyArn:
    Description: update-user-pool --lambda-config KMSKeyID degeri
    Value: !GetAtt EmailKmsKey.Arn
  AlarmTopicArn:
    Description: Alarm SNS konusu - ek abone (Slack/PagerDuty) buraya baglanir.
    Value: !Ref EmailAlarmTopic
