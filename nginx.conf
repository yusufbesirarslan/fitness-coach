# ============================================================================
# FitX — EC2 host nginx site konfigürasyonu
#
# Bu dosya HTTP (port 80) ile başlar. TLS'i certbot OTOMATİK ekler:
#   sudo certbot --nginx -d <senin-domainin>
# certbot bu bloğu kopyalayıp 443 + sertifika + 80→443 redirect yazar.
# (Sertifika yollarını elle yazmıyoruz; yoksa `nginx -t` patlar.)
#
# Yerleşim:
#   sudo cp nginx.conf /etc/nginx/sites-available/fitx
#   sudo sed -i 's/fitx.duckdns.org/SENIN-DOMAININ/' /etc/nginx/sites-available/fitx
#   sudo ln -sf /etc/nginx/sites-available/fitx /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Mimari:  Internet → nginx (host 80/443) → Flask (Docker, 127.0.0.1:5000)
#                                         └→ /fatsecret/ → FatSecret proxy (127.0.0.1:3000, loopback)
#
# ÖNEMLİ nginx kuralı: `proxy_set_header` miras GEÇMEZ. Bir location kendi
# proxy_set_header'ını tanımlarsa, server seviyesindekiler o location için
# YOK SAYILIR. Bu yüzden başlıkları her location İÇİNDE tam tekrar ediyoruz —
# aksi halde Host varsayılanı 127.0.0.1:5000 olur ve CSRF/secure-cookie kırılır.
# ============================================================================

# FatSecret proxy'nin adresi. Proxy AYNI EC2 üzerinde :3000'de çalışır; bu yüzden
# LOOPBACK (127.0.0.1) üzerinden konuşuruz, public IP (18.153.156.28) üzerinden DEĞİL.
# Neden: bu kanal `Authorization: Bearer <FatSecret token>` taşır (app→nginx TLS ile
# gelir ama nginx→upstream ayrı bir hop'tur). Public IP'ye düz metin HTTP ile gitseydi
# token, host'un NIC'inden çıkıp ağda açıkta seyahat ederdi. Loopback'te kalınca tel
# üzerinde maruziyet YOK — Flask:5000 ve redis:6379 ile aynı güvenli desen.
upstream fatsecret_proxy {
    server 127.0.0.1:3000;
}

# ── Rate limiting (L7 flood koruması) ──────────────────────────────────
# Bu dosya http{} bağlamına include edildiği için (yukarıdaki `upstream` da
# http-context'tir) limit_req_zone burada tanımlanabilir. IP başına istek
# hızını sınırlar; burst yüksek tutuldu ki normal sayfa yüklemeleri (statik +
# API çağrıları) takılmasın — yalnızca aşırı flood'lar 429 alır.
limit_req_zone $binary_remote_addr zone=perip:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    # ÖNEMLİ: kendi DuckDNS subdomain'inle değiştir (certbot -d ile aynı olmalı).
    server_name fitx.duckdns.org;

    # nginx sürüm bilgisini gizle (Server header + varsayılan hata sayfaları).
    server_tokens off;

    # ── Güvenlik başlıkları ────────────────────────────────────────────────
    # `always` → hata yanıtlarına (4xx/5xx) da uygulanır. DİKKAT: bir location
    # kendi add_header'ını tanımlarsa bunlar O location'da devre dışı kalır;
    # mevcut location'lar add_header KULLANMIYOR, dolayısıyla miras geçer.
    # HSTS yalnızca HTTPS'te etkilidir (certbot bu bloğu 443'e kopyalar).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options          "DENY" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    # CSP: artık Flask tarafından üretilir (bkz. app/hooks.py set_csp_header) —
    # satır-içi script blokları per-request NONCE ile imzalanır ve script-src'den
    # 'unsafe-inline' kaldırıldı; statik nginx config'de nonce üretilemediği için
    # başlık buradan TAŞINDI. Çift CSP başlığı politikaların KESİŞİMİNİ uygular
    # ve nonce'lu yeni politikayı etkisiz kılabilir; bu yüzden deploy workflow'u
    # (.github/workflows/deploy.yml) host'taki canlı config'de kalan eski CSP
    # add_header satırını otomatik siler ve nginx'i reload eder.

    # Foto/PDF yüklemeleri için gövde limiti (Pump Check foto doğrulama vb.).
    # (Bu ve aşağıdaki timeout'lar normal şekilde location'lara miras geçer.)
    client_max_body_size 25m;

    # Uzun süren AI Coach istekleri kesilmesin (gunicorn --timeout 300 ile uyumlu).
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # ── FatSecret proxy (kısıtlı) ──────────────────────────────────────────
    # Prod'da FATSECRET_BASE_URL=https://<domain>/fatsecret ise backend buraya
    # vurur; doğrudan IP kullanılıyorsa bu location hiç devreye girmez.
    # Yalnızca gerçekten kullanılan TEK FatSecret REST ucu proxy'lenir
    # (uygulama: FATSECRET_API_URL = <base>/rest/server.api). Eskiden
    # /fatsecret/<herhangi-yol> yukarı akışa körü körüne iletiliyordu (açık
    # proxy); artık yalnızca bu tam yol kabul edilir, gerisi 404. OAuth token'ı
    # uygulama doğrudan oauth.fatsecret.com'dan alır — buradan GEÇMEZ.
    # (Bilinçli olarak limit_req YOK: bu kanal backend→proxy çağrılarını da
    #  taşıyabilir ve hepsi tek IP'den göründüğü için per-IP limit gerçek
    #  trafiği boğardı; güvenlik kontrolü yol kısıtlamasıdır.)
    location = /fatsecret/rest/server.api {
        proxy_pass http://fatsecret_proxy/rest/server.api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Normal API / Web trafiği → Flask (Docker, sadece localhost) ────────
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        limit_req zone=perip burst=60 nodelay;

        # Bu 4 başlık ŞART: Host → CSRF/Origin eşleşmesi; X-Forwarded-Proto →
        # ProxyFix(x_proto=1) → secure cookie. Eksikse kayıt/giriş POST'ları 403 olur.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / streaming
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}
