# ============================================================================
# FitX — EC2 host nginx site konfigürasyonu (taslak)
#
# Yerleşim:
#   sudo cp nginx.conf /etc/nginx/sites-available/fitx
#   sudo ln -s /etc/nginx/sites-available/fitx /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Mimari:  Internet → nginx (host, 80/443) → Flask (Docker, 127.0.0.1:5000)
#                                          └→ /fatsecret/ → FatSecret proxy (statik IP)
#
# server_name ve TLS sertifika yollarını kendi alan adınıza göre doldurun
# (örn. `sudo certbot --nginx -d fitx.example.com`).
# ============================================================================

# FatSecret proxy'nin sabit adresi — mevcut yönlendirme korunuyor.
upstream fatsecret_proxy {
    server 18.153.156.28:3000;
}

# ── HTTP (80): ACME doğrulaması + HTTPS'e yönlendirme ───────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;   # TODO: fitx.example.com

    # Let's Encrypt webroot doğrulaması bu yoldan geçsin.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Diğer tüm trafiği HTTPS'e taşı. Secure cookie (SESSION_COOKIE_SECURE) ve
    # FatSecret TLS zorunlulugu yalnızca https üzerinde çalışır.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS (443): asıl reverse proxy ─────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;   # TODO: fitx.example.com

    # TODO: sertifika yolları (certbot bunları otomatik doldurur).
    ssl_certificate     /etc/letsencrypt/live/fitx.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fitx.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Foto/PDF yüklemeleri için gövde limiti (Pump Check foto doğrulama vb.).
    client_max_body_size 25m;

    # Uzun süren AI Coach istekleri kesilmesin (gunicorn --timeout 300 ile uyumlu).
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # Ortak proxy başlıkları. ProxyFix(x_for=1, x_proto=1) bunları okuyarak
    # gerçek istemci IP'sini (rate limit) ve şemayı (secure cookie) belirler.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── FatSecret proxy: mevcut /fatsecret/ endpoint'i korunuyor ───────────
    # Sondaki "/" prefix'i soyar: /fatsecret/rest/server.api → /rest/server.api
    # Uygulama tarafında FATSECRET_BASE_URL=https://<domain>/fatsecret olmalı.
    location /fatsecret/ {
        proxy_pass http://fatsecret_proxy/;
        proxy_set_header Host $host;
    }

    # ── Normal API / Web trafiği → Flask (Docker) ──────────────────────────
    location / {
        proxy_pass http://127.0.0.1:5000;

        # WebSocket / streaming desteği (gerekirse).
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}
