[pytest]
# Load/stres testleri (tests/load/, @pytest.mark.load) VARSAYILAN koşuda
# ATLANIR — yavaş, eşzamanlılık/arıza-enjeksiyonu ağırlıklı ve CI'ı bloklamamalı.
# Açıkça çalıştır: `python -m pytest -m load`. Diğer her şey normal koşar.
addopts = -m "not load and not linux_lock and not linux_helper_identity"
# `instance/` is Flask'in RUNTIME klasörüdür (SQLite dosyası, pytest basetemp
# artıkları) — asla test kaynağı değildir, ama pytest varsayılanı onu gezerdi.
# Orada kalan tek erişilemez dizin (izinleri kısıtlanmış bir test artığı) TÜM
# depo kökü koşusunu WinError 5 / PermissionError ile collection'da düşürüyordu
# — yani tam-regresyon kanıtı ilgisiz yerel çöp yüzünden üretilemiyordu.
# Varsayılan liste yeniden tanımlandığı için pytest'in kendi girdileri korunur.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv instance
markers =
    linux_lock: authoritative root Linux kernel/OFD production-lock test
    linux_helper_identity: authoritative root Linux privileged-helper object identity test
    load: yük/stres testi (yavaş; varsayılan koşuda atlanır — `-m load` ile çalıştır)
    pg_concurrency: opt-in Postgres eşzamanlılık testi (FITX_PG_CONCURRENCY_TEST=1 + PG_TEST_DATABASE_URL; `-m pg_concurrency` ile çalıştır)
