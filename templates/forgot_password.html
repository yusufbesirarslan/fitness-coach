<!DOCTYPE html>
<html lang="{{ locale }}" data-theme="dark">
<head>
    {% include "_head.html" %}
    <title>{{ t('forgot.title') }} - AxisAI</title>
    <meta name="description" content="AxisAI sifreni sifirla - kullanici adini gir, e-postana sifirlama kodu gonderelim.">
    <link rel="stylesheet" href="/static/auth.css">
</head>
<body class="auth-body">
<div class="auth-shell">
    <header class="auth-topbar">
        <a class="auth-brand" href="/welcome" aria-label="AxisAI">
            <img src="/static/icon-holo.png" alt="">AxisAI
        </a>
        <div class="auth-controls">
            <div class="lang-switch" role="group" aria-label="{{ t('lang.aria') }}">
                <button type="button" class="lang-opt{% if locale == 'tr' %} on{% endif %}" data-action="setLang" data-args='["tr"]'>TR</button>
                <button type="button" class="lang-opt{% if locale == 'en' %} on{% endif %}" data-action="setLang" data-args='["en"]'>EN</button>
            </div>
            <button type="button" class="theme-toggle" data-action="toggleTheme" aria-label="{{ t('theme.aria') }}"></button>
        </div>
    </header>

    <main class="auth-main">
        <section class="auth-card" aria-labelledby="forgot-title">
            <p class="auth-kicker">AxisAI</p>
            <h1 class="auth-title" id="forgot-title">{{ t('forgot.title') }}</h1>
            <p class="auth-subtitle">{{ t('forgot.subtitle') }}</p>

            <div class="auth-alert auth-alert-error" id="error-msg" role="alert" aria-live="polite"></div>
            <div class="auth-alert auth-alert-success" id="success-msg" role="status" aria-live="polite"></div>

            <div class="auth-form">
                <div class="auth-field">
                    <label for="username">{{ t('form.username') }}</label>
                    <input type="text" id="username" name="username" value="{{ username }}"
                           placeholder="{{ t('forgot.username_ph') }}" autocomplete="username"
                           autocapitalize="none" spellcheck="false" data-action-keydown="forgotOnEnter">
                </div>

                <button type="button" class="auth-btn" id="forgot-submit" data-action="forgotPassword">{{ t('forgot.submit') }}</button>

                <div class="auth-row">
                    <span>{{ t('forgot.have_code') }}</span>
                    <a class="auth-link" href="/reset-password">{{ t('forgot.reset_link') }}</a>
                </div>
                <div class="auth-row">
                    <a class="auth-link" href="/login">{{ t('forgot.back_login') }}</a>
                </div>
            </div>
        </section>
    </main>
</div>
<script src="/static/auth.js"></script>
<script src="/static/actions.js"></script>
</body>
</html>
