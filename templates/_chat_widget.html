<!-- ═══════════════════════════════════════════════════════════════
     AI COACH FLOATING CHAT WIDGET
     Self-contained — drop {% include '_chat_widget.html' %}
     just before </body> in any authenticated page template.
     Communicates with /ask endpoint. Exposes window.CW.receiveCheckinFeedback(text).
     ═══════════════════════════════════════════════════════════════ -->
<style>
  /* ── Root container ── */
  #cw-root {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 9998;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 12px;
    pointer-events: none; /* children opt-in */
  }
  @media (max-width: 768px) {
    #cw-root { bottom: 80px; right: 16px; }
  }

  /* ── Chat window ── */
  #cw-window {
    width: 360px;
    height: 500px;
    background: #1E1E1E;
    border: 1px solid #333333;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 25px 60px rgba(0,0,0,0.72), 0 0 0 1px rgba(204,255,0,0.04), inset 0 1px 0 rgba(255,255,255,0.04);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    pointer-events: all;
    /* closed state */
    opacity: 0;
    transform: translateY(14px) scale(0.96);
    transition: opacity 0.22s cubic-bezier(0.4,0,0.2,1),
                transform 0.22s cubic-bezier(0.4,0,0.2,1);
    pointer-events: none;
  }
  #cw-window.cw-open {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: all;
  }
  @media (max-width: 480px) {
    #cw-window { width: calc(100vw - 32px); height: 68vh; border-radius: 14px; }
  }

  /* ── Header ── */
  #cw-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid #2A2A2A;
    flex-shrink: 0;
    background: #1E1E1E;
  }
  #cw-header-left { display: flex; align-items: center; gap: 10px; }
  #cw-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #CCFF00 0%, #99cc00 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; flex-shrink: 0;
    box-shadow: 0 0 12px rgba(204,255,0,0.3);
  }
  #cw-header-title {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 600; color: #FFFFFF;
    line-height: 1;
  }
  #cw-close {
    width: 30px; height: 30px; border-radius: 8px;
    background: rgba(255,255,255,0.05); border: none;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s; color: #888; flex-shrink: 0;
  }
  #cw-close:hover { background: rgba(255,255,255,0.1); color: #DDD; }
  #cw-close svg { width: 15px; height: 15px; }

  /* ── Messages scroll area ── */
  #cw-msgs {
    flex: 1; overflow-y: auto; padding: 14px 14px 8px;
    display: flex; flex-direction: column; gap: 8px;
    scrollbar-width: thin; scrollbar-color: #2E2E2E transparent;
  }
  #cw-msgs::-webkit-scrollbar { width: 4px; }
  #cw-msgs::-webkit-scrollbar-thumb { background: #2E2E2E; border-radius: 2px; }

  .cw-empty-state {
    margin: auto;
    text-align: center; color: #4A4A4A;
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-style: italic;
    padding: 24px 0;
  }

  /* Message rows */
  .cw-row { display: flex; flex-direction: column; max-width: 86%; }
  .cw-row.cw-user { align-self: flex-end; align-items: flex-end; }
  .cw-row.cw-bot  { align-self: flex-start; align-items: flex-start; }

  /* Bubbles */
  .cw-bubble {
    padding: 9px 13px; border-radius: 12px;
    font-family: 'DM Sans', sans-serif; font-size: 13.5px;
    line-height: 1.62; font-weight: 300; word-break: break-word;
  }
  .cw-user .cw-bubble {
    background: transparent;
    border: 1px solid #CCFF00;
    color: #CCFF00;
    border-bottom-right-radius: 4px;
  }
  .cw-bot .cw-bubble {
    background: #2A2A2A;
    color: #E2E2E2;
    border-bottom-left-radius: 4px;
  }
  .cw-ts {
    font-size: 10px; color: #484848;
    font-family: 'DM Sans', sans-serif;
    margin-top: 3px; padding: 0 2px;
  }

  /* Loading indicator (three-dot bounce) */
  .cw-typing {
    display: flex; gap: 5px; align-items: center;
    padding: 12px 14px; min-height: 40px;
  }
  .cw-typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: #CCFF00; opacity: 0.4;
    animation: cw-bounce 1.3s ease-in-out infinite;
  }
  .cw-typing span:nth-child(2) { animation-delay: 0.18s; }
  .cw-typing span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes cw-bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40%           { transform: translateY(-5px); opacity: 1; }
  }

  /* ── Input row ── */
  #cw-input-row {
    display: flex; align-items: center;
    border-top: 1px solid #2A2A2A;
    padding: 10px 12px; gap: 8px;
    flex-shrink: 0; background: #1E1E1E;
  }
  #cw-input {
    flex: 1;
    background: #121212;
    border: 1px solid #2E2E2E;
    border-radius: 10px;
    padding: 9px 13px;
    font-family: 'DM Sans', sans-serif; font-size: 13.5px;
    color: #FFFFFF; outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  #cw-input::placeholder { color: #484848; }
  #cw-input:focus {
    border-color: rgba(204,255,0,0.38);
    box-shadow: 0 0 0 3px rgba(204,255,0,0.06);
  }
  #cw-send {
    width: 38px; height: 38px; border-radius: 10px;
    background: #CCFF00; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, transform 0.15s, opacity 0.15s;
    flex-shrink: 0;
  }
  #cw-send:hover { background: #d6ff1a; transform: scale(1.06); }
  #cw-send:active { transform: scale(0.95); }
  #cw-send.cw-busy { opacity: 0.5; cursor: not-allowed; transform: none !important; }
  #cw-send svg { width: 16px; height: 16px; color: #121212; }

  /* ── FAB ── */
  #cw-fab {
    width: 56px; height: 56px; border-radius: 50%;
    background: #CCFF00; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 20px rgba(204,255,0,0.35), 0 2px 8px rgba(0,0,0,0.55);
    transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    position: relative; flex-shrink: 0;
    pointer-events: all;
  }
  #cw-fab:hover {
    transform: scale(1.08);
    box-shadow: 0 6px 28px rgba(204,255,0,0.5), 0 4px 12px rgba(0,0,0,0.5);
  }
  #cw-fab svg { width: 24px; height: 24px; color: #121212; }
  #cw-fab.cw-hidden { opacity: 0; pointer-events: none; transform: scale(0.8); }

  /* Badge */
  #cw-badge {
    position: absolute; top: -2px; right: -2px;
    width: 15px; height: 15px; border-radius: 50%;
    background: #FF3B30; border: 2px solid #121212;
    display: none;
    animation: cw-badge-pulse 1.6s ease-in-out infinite;
  }
  @keyframes cw-badge-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,59,48,0.6); }
    50%       { box-shadow: 0 0 0 5px rgba(255,59,48,0); }
  }

  /* ── New-message toast ── */
  #cw-notify {
    position: fixed;
    bottom: 96px; right: 24px;
    background: #1E1E1E;
    border: 1px solid rgba(204,255,0,0.22);
    border-radius: 10px;
    padding: 10px 15px;
    font-family: 'DM Sans', sans-serif; font-size: 13px; color: #E0E0E0;
    box-shadow: 0 4px 20px rgba(0,0,0,0.55);
    z-index: 9999;
    opacity: 0; transform: translateY(8px);
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
    display: flex; align-items: center; gap: 9px;
    max-width: 250px;
  }
  #cw-notify.cw-notify-show { opacity: 1; transform: translateY(0); }
  .cw-notify-icon { font-size: 15px; flex-shrink: 0; }
  @media (max-width: 768px) {
    #cw-notify { bottom: 160px; right: 16px; }
  }
</style>

<!-- ── WIDGET ROOT ── -->
<div id="cw-root">

  <!-- ① Chat window (starts hidden) -->
  <div id="cw-window" role="dialog" aria-label="AI Fitness Coach" aria-modal="true">

    <!-- Header -->
    <div id="cw-header">
      <div id="cw-header-left">
        <div id="cw-avatar">🏋️</div>
        <div>
          <div id="cw-header-title">AI Fitness Coach</div>
        </div>
      </div>
      <button id="cw-close" onclick="CW.toggle()" aria-label="Sohbeti kapat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Messages -->
    <div id="cw-msgs" role="log" aria-live="polite"></div>

    <!-- Input -->
    <div id="cw-input-row">
      <input
        type="text" id="cw-input"
        placeholder="Bir şey sor..."
        autocomplete="off" autocorrect="off"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();CW.send();}"
      >
      <button id="cw-send" onclick="CW.send()" aria-label="Gönder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>

  </div>

  <!-- ② FAB (collapsed state) -->
  <button id="cw-fab" onclick="CW.toggle()" aria-label="Koçunla sohbet et">
    <span id="cw-badge" aria-hidden="true"></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
  </button>

</div>

<!-- New-message notification -->
<div id="cw-notify" aria-live="assertive">
  <span class="cw-notify-icon">💬</span>
  Koçundan yeni bir mesaj var!
</div>

<script nonce="{{ csp_nonce }}">
(function () {
  'use strict';

  const STORAGE_KEY = 'fc_coach_messages';
  const MAX_MESSAGES = 60;

  /* ─────────────────────────────────────────────
     CW — public widget API (attached to window)
  ───────────────────────────────────────────── */
  var CW = window.CW = {
    open:    false,
    busy:    false,
    unread:  false,
    messages: [],

    /* Called on DOMContentLoaded */
    init: function () {
      try {
        var stored = sessionStorage.getItem(STORAGE_KEY);
        this.messages = stored ? JSON.parse(stored) : [];
      } catch (_) {
        this.messages = [];
      }

      if (this.messages.length === 0) {
        this._push('bot',
          'Merhaba! 💪 Ben AI fitness koçunum. Antrenman, beslenme veya sağlıkla ilgili her şeyi sorabilirsin.');
      } else {
        this._render();
      }
    },

    /* Toggle open / closed */
    toggle: function () {
      this.open = !this.open;
      var win  = document.getElementById('cw-window');
      var fab  = document.getElementById('cw-fab');

      if (this.open) {
        win.classList.add('cw-open');
        fab.classList.add('cw-hidden');
        this.unread = false;
        document.getElementById('cw-badge').style.display = 'none';
        this._scrollBottom();
        setTimeout(function () {
          var inp = document.getElementById('cw-input');
          if (inp) inp.focus();
        }, 240);
      } else {
        win.classList.remove('cw-open');
        fab.classList.remove('cw-hidden');
      }
    },

    /* Send user message to /ask */
    send: function () {
      var input    = document.getElementById('cw-input');
      var question = input.value.trim();
      if (!question || this.busy) return;
      input.value = '';

      this._push('user', question);
      this._setLoading(true);

      var self = this;
      fetch('/ask', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ question: question })
      })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        self._setLoading(false);
        self._push('bot', data.answer || data.error || 'Yanıt alınamadı.');
      })
      .catch(function () {
        self._setLoading(false);
        self._push('bot', 'Bağlantı hatası. Lütfen tekrar dene.');
      });
    },

    /* Called by check-in form after AI feedback arrives */
    receiveCheckinFeedback: function (text) {
      this._push('bot', '📊 Check-in Geri Bildirimi\n\n' + text);
      if (!this.open) {
        this.unread = true;
        document.getElementById('cw-badge').style.display = 'block';
        this._showNotify();
      }
    },

    /* ── Private helpers ── */

    _push: function (role, text) {
      var now  = new Date();
      var time = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
      this.messages.push({ role: role, text: text, time: time });
      try {
        sessionStorage.setItem(STORAGE_KEY,
          JSON.stringify(this.messages.slice(-MAX_MESSAGES)));
      } catch (_) {}
      this._render();
      this._scrollBottom();
    },

    _render: function () {
      var container = document.getElementById('cw-msgs');
      if (!container) return;

      if (this.messages.length === 0 && !this.busy) {
        container.innerHTML = '<div class="cw-empty-state">Koçuna bir şey sor...</div>';
        return;
      }

      var html = this.messages.map(function (m) {
        var cls     = m.role === 'user' ? 'cw-user' : 'cw-bot';
        var escaped = m.text
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\n/g, '<br>');
        return '<div class="cw-row ' + cls + '">' +
                 '<div class="cw-bubble">' + escaped + '</div>' +
                 '<div class="cw-ts">' + m.time + '</div>' +
               '</div>';
      }).join('');

      if (this.busy) {
        html += '<div class="cw-row cw-bot">' +
                  '<div class="cw-bubble cw-typing">' +
                    '<span></span><span></span><span></span>' +
                  '</div>' +
                '</div>';
      }

      container.innerHTML = html;
    },

    _scrollBottom: function () {
      var el = document.getElementById('cw-msgs');
      if (el) requestAnimationFrame(function () { el.scrollTop = el.scrollHeight; });
    },

    _setLoading: function (state) {
      this.busy = state;
      var btn = document.getElementById('cw-send');
      if (btn) btn.classList.toggle('cw-busy', state);
      this._render();
      this._scrollBottom();
    },

    _showNotify: function () {
      var n = document.getElementById('cw-notify');
      if (!n) return;
      n.classList.add('cw-notify-show');
      setTimeout(function () { n.classList.remove('cw-notify-show'); }, 5000);
    }
  };

  /* Boot */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { CW.init(); });
  } else {
    CW.init();
  }
})();
</script>
