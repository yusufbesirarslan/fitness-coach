<!DOCTYPE html>
<html lang="{{ locale }}" data-theme="dark">
<head>
    {% include "_head.html" %}
    <title>{{ t('gallery.page_title') }}</title>
    <link rel="stylesheet" href="/static/theme.css">
    <link rel="stylesheet" href="/static/nav.css">
    <link rel="stylesheet" href="/static/pump_check_gallery.css">
</head>
{% set nav_active = 'profile' %}
<body class="page-body">
<div class="toast-wrap" id="toast-wrap"></div>
{% include "_nav.html" %}
<main class="main-content">
    <div class="page-hdr">
        <h1>{{ t('gallery.h1_a') }}<br><span>{{ t('gallery.h1_b') }}</span></h1>
        <p>{{ t('gallery.page_sub') }}</p>
    </div>
    <div class="gallery-wrap">
        <div class="gallery-grid" id="gallery-grid"></div>
    </div>
</main>
{% include "_actionbar.html" %}
<div class="gallery-modal" id="gallery-modal" role="dialog" aria-modal="true" aria-labelledby="gallery-modal-title">
    <div class="gallery-detail" id="gallery-detail"></div>
</div>
<script nonce="{{ csp_nonce }}">
var __t = window.t || function(k){ return k; };
const ME_NAME = {{ current_user.username|tojson }};
const grid = document.getElementById('gallery-grid');
const modal = document.getElementById('gallery-modal');
const detail = document.getElementById('gallery-detail');
let galleryItems = [];
function esc(v){ const d=document.createElement('div'); d.textContent=v == null ? '' : String(v); return d.innerHTML; }
// location_type kanonik TR ('Ev'/'Spor Salonu') gelir; görünen etiket display-map ile çevrilir.
function envLabel(v){ const m = {'Ev': __t('training.loc_home'), 'Spor Salonu': __t('training.loc_gym')}; return m[v] || v; }
function cardMedia(item){
  if(item.imageUrl){
    return '<img src="'+esc(item.imageUrl).replace(/"/g,'&quot;')+'" loading="lazy" decoding="async" alt="">';
  }
  return '<div class="gallery-media-fallback" aria-hidden="true"></div>';
}
function itemHTML(item){
  return '<button type="button" class="gallery-item" data-id="'+item.id+'">'+cardMedia(item)+'<div class="gallery-meta"><div class="gallery-date">'+esc(item.timePosted)+'</div><div class="gallery-desc">'+esc(item.description)+'</div></div></button>';
}
function openDetail(item){
  const image = item.imageUrl
    ? '<img src="'+esc(item.imageUrl).replace(/"/g,'&quot;')+'" alt="">'
    : '<div class="gallery-detail-fallback" aria-hidden="true"></div>';
  detail.innerHTML = image +
    '<div class="gallery-detail-body">' +
    '<h2 id="gallery-modal-title" style="margin:0;font-family:var(--font-display);letter-spacing:.08em;">' + esc(item.timePosted) + '</h2>' +
    (item.workoutScore != null ? '<div><div class="gallery-label">'+__t('feed.workout_score')+'</div><div class="gallery-value">'+esc(item.workoutScore)+'</div></div>' : '') +
    '<div><div class="gallery-label">'+__t('feed.environment')+'</div><div class="gallery-value">'+esc(envLabel(item.environment))+'</div></div>' +
    '<div><div class="gallery-label">'+__t('feed.description')+'</div><div class="gallery-value">'+esc(item.description)+'</div></div>' +
    '<div><div class="gallery-label">'+__t('gallery.sharing_status')+'</div><div class="gallery-value">'+esc(__t(item.sharingStatus && item.sharingStatus.key ? item.sharingStatus.key : ""))+'</div></div>' +
    '<div><div class="gallery-label">'+__t('feed.repost')+'</div><div class="gallery-value">'+__t('feed.reposts_count', {n: item.repostsCount || 0})+'</div></div>' +
    '<div class="gallery-actions"><button type="button" class="btn-ghost" data-close-gallery>'+__t('common.cancel')+'</button><button type="button" class="btn-ghost" data-share-gallery>'+__t('feed.share')+'</button><button type="button" class="btn-ghost" data-delete-gallery="'+item.id+'">'+__t('gallery.delete')+'</button></div>' +
    '</div>';
  modal.classList.add('show');
  document.body.style.overflow = 'hidden';
}
async function loadGallery(){
  const res = await fetch('/pump-check-gallery/data');
  const data = await res.json();
  galleryItems = data.items || [];
  grid.innerHTML = galleryItems.length ? galleryItems.map(itemHTML).join('') : '<div class="empty-state"><div class="empty-icon">📷</div><div class="empty-desc">'+__t('gallery.empty')+'</div></div>';
}
function closeModal(){
  modal.classList.remove('show');
  document.body.style.overflow = '';
}
grid.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-id]');
  if(!btn) return;
  const item = galleryItems.find((row) => String(row.id) === btn.dataset.id);
  if(item) openDetail(item);
});
async function shareCheck(username){
  const text = __t('feed.share_text', {username: username});
  const url = window.location.origin + '/feed';
  if(navigator.share){ try { await navigator.share({text: text, url: url}); return; } catch(err){ if(err && err.name === 'AbortError') return; } }
  try {
    await navigator.clipboard.writeText(text + ' ' + url);
    if(window.toast) window.toast(__t('feed.copied'));
  } catch(err){}
}
modal.addEventListener('click', async (e) => {
  if(e.target === modal || e.target.closest('[data-close-gallery]')){
    closeModal();
    return;
  }
  if(e.target.closest('[data-share-gallery]')){
    shareCheck(ME_NAME);
    return;
  }
  const del = e.target.closest('[data-delete-gallery]');
  if(!del) return;
  if(!window.confirm(__t('gallery.delete_confirm'))) return;
  const res = await fetch('/pump-check-gallery/' + del.dataset.deleteGallery, {method:'DELETE'});
  if(res.ok){
    closeModal();
    await loadGallery();
  }
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && modal.classList.contains('show')) closeModal();
});
loadGallery();
</script>
<script src="/static/actions.js"></script>
</body>
</html>
