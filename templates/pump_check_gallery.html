<!DOCTYPE html>
<html lang="{{ locale }}" data-theme="dark">
<head>
    {% include "_head.html" %}
    <title>{{ t('gallery.page_title') }}</title>
    <link rel="stylesheet" href="/static/theme.css">
    <link rel="stylesheet" href="/static/nav.css">
    <link rel="stylesheet" href="/static/pump_check_gallery.css">
</head>
{% set nav_active = 'gallery' %}
<body class="page-body">
<div class="toast-wrap" id="toast-wrap"></div>
{% include "_nav.html" %}
<main class="main-content">
    <div class="page-hdr gallery-hdr">
        <h1>{{ t('gallery.h1_a') }} <span>{{ t('gallery.h1_b') }}</span></h1>
        <p>{{ t('gallery.page_sub') }}</p>
    </div>
    <div class="gallery-wrap">
        <div class="gallery-grid" id="gallery-grid" data-state="loading"></div>
    </div>
</main>
{% include "_actionbar.html" %}
<div class="gallery-modal" id="gallery-modal" role="dialog" aria-modal="true" aria-labelledby="gallery-modal-title">
    <div class="gallery-detail" id="gallery-detail"></div>
</div>
<script nonce="{{ csp_nonce }}">
var __t = window.t || function(k){ return k; };
const ME_NAME = {{ current_user.username|tojson }};
const grid = document.getElementById('gallery-grid');
const modal = document.getElementById('gallery-modal');
const detail = document.getElementById('gallery-detail');
let galleryItems = [];
let lastFocused = null;
function esc(v){ const d=document.createElement('div'); d.textContent=v == null ? '' : String(v); return d.innerHTML; }
function attr(v){ return esc(v).replace(/"/g,'&quot;'); }
// location_type kanonik TR ('Ev'/'Spor Salonu') gelir; görünen etiket display-map ile çevrilir.
function envLabel(v){ const m = {'Ev': __t('training.loc_home'), 'Spor Salonu': __t('training.loc_gym')}; return m[v] || v; }
function photoFallback(kind){
  const cls = kind === 'detail' ? 'gallery-detail-fallback' : 'gallery-media-fallback';
  const label = esc(__t('gallery.photo_unavailable'));
  return '<div class="'+cls+'" role="img" aria-label="'+label+'">'+label+'</div>';
}
// The media frame owns the geometry (aspect-ratio in CSS), so a photo, a
// still-loading photo and the unavailable fallback all occupy the same box and
// nothing reflows when the bytes land.
function cardMedia(item){
  const inner = item.imageUrl
    ? '<img data-gallery-photo src="'+attr(item.imageUrl)+'" loading="lazy" decoding="async" alt="">'
    : photoFallback('card');
  return '<span class="gallery-media">'+inner+'</span>';
}
function bindGalleryPhotos(root){
  root.querySelectorAll('img[data-gallery-photo]').forEach((img) => {
    img.addEventListener('error', function onFail(){
      img.removeEventListener('error', onFail);
      const kind = img.closest('.gallery-detail') ? 'detail' : 'card';
      img.outerHTML = photoFallback(kind);
    });
  });
}
function itemHTML(item){
  return '<button type="button" class="gallery-item" data-id="'+item.id+'">'+cardMedia(item)+'<span class="gallery-meta"><span class="gallery-date">'+esc(item.timePosted)+'</span><span class="gallery-desc">'+esc(item.description)+'</span></span></button>';
}
// Two reserved rows at the grid's ACTUAL column count, so the placeholder
// occupies the geometry the photos will occupy instead of a guessed number.
function skeletonHTML(){
  const tracks = getComputedStyle(grid).gridTemplateColumns.split(' ').filter(Boolean);
  const columns = Math.max(tracks.length, 1);
  let out = '';
  for(let i = 0; i < columns * 2; i++){
    out += '<div class="gallery-skeleton" aria-hidden="true"><div class="gallery-skeleton-media"></div><div class="gallery-skeleton-meta"></div></div>';
  }
  return out;
}
function emptyHTML(){
  return '<div class="empty-state gallery-state">' +
    '<div class="empty-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>' +
    '<div class="empty-title">'+esc(__t('gallery.empty_title'))+'</div>' +
    '<div class="empty-desc">'+esc(__t('gallery.empty'))+'</div>' +
    '<a class="btn-ghost" href="/training">'+esc(__t('gallery.empty_cta'))+'</a>' +
    '</div>';
}
// A read failure is NOT an empty gallery: presenting one as the other would tell
// the user their Pump Checks are gone.
function errorHTML(){
  return '<div class="empty-state gallery-state">' +
    '<div class="empty-title">'+esc(__t('gallery.unavailable'))+'</div>' +
    '<button type="button" class="btn-ghost" data-retry-gallery>'+esc(__t('gallery.retry'))+'</button>' +
    '</div>';
}
function openDetail(item){
  lastFocused = document.activeElement;
  const image = item.imageUrl
    ? '<img data-gallery-photo src="'+attr(item.imageUrl)+'" alt="">'
    : photoFallback('detail');
  const closeLabel = attr(__t('training.close'));
  detail.innerHTML =
    '<div class="gallery-detail-media">' + image +
    '<button type="button" class="gallery-detail-close" data-close-gallery aria-label="'+closeLabel+'">&times;</button>' +
    '</div>' +
    '<div class="gallery-detail-body">' +
    '<h2 id="gallery-modal-title" class="gallery-detail-title">' + esc(item.timePosted) + '</h2>' +
    (item.workoutScore != null ? '<div><div class="gallery-label">'+__t('feed.workout_score')+'</div><div class="gallery-value">'+esc(item.workoutScore)+'</div></div>' : '') +
    '<div><div class="gallery-label">'+__t('feed.environment')+'</div><div class="gallery-value">'+esc(envLabel(item.environment))+'</div></div>' +
    '<div><div class="gallery-label">'+__t('feed.description')+'</div><div class="gallery-value">'+esc(item.description)+'</div></div>' +
    '<div><div class="gallery-label">'+__t('gallery.sharing_status')+'</div><div class="gallery-value">'+esc(__t(item.sharingStatus && item.sharingStatus.key ? item.sharingStatus.key : ""))+'</div></div>' +
    '<div><div class="gallery-label">'+__t('feed.repost')+'</div><div class="gallery-value">'+__t('feed.reposts_count', {n: item.repostsCount || 0})+'</div></div>' +
    '<div class="gallery-actions"><button type="button" class="btn-ghost" data-share-gallery>'+__t('feed.share')+'</button><button type="button" class="btn-ghost" data-delete-gallery="'+item.id+'">'+__t('gallery.delete')+'</button></div>' +
    '</div>';
  modal.classList.add('show');
  document.body.style.overflow = 'hidden';
  bindGalleryPhotos(detail);
  const close = detail.querySelector('[data-close-gallery]');
  if(close) close.focus();
}
async function loadGallery(){
  grid.setAttribute('data-state', 'loading');
  grid.innerHTML = skeletonHTML();
  let data;
  try {
    const res = await fetch('/pump-check-gallery/data');
    if(!res.ok) throw new Error('gallery_unavailable');
    data = await res.json();
  } catch (err) {
    galleryItems = [];
    grid.setAttribute('data-state', 'unavailable');
    grid.innerHTML = errorHTML();
    return;
  }
  galleryItems = data.items || [];
  grid.setAttribute('data-state', galleryItems.length ? 'populated' : 'empty');
  grid.innerHTML = galleryItems.length ? galleryItems.map(itemHTML).join('') : emptyHTML();
  bindGalleryPhotos(grid);
}
function closeModal(){
  modal.classList.remove('show');
  document.body.style.overflow = '';
  detail.innerHTML = '';
  if(lastFocused && document.contains(lastFocused)) lastFocused.focus();
  lastFocused = null;
}
grid.addEventListener('click', (e) => {
  if(e.target.closest('[data-retry-gallery]')){
    loadGallery();
    return;
  }
  const btn = e.target.closest('[data-id]');
  if(!btn) return;
  const item = galleryItems.find((row) => String(row.id) === btn.dataset.id);
  if(item) openDetail(item);
});
async function shareCheck(username){
  const text = __t('feed.share_text', {username: username});
  const url = window.location.origin + '/feed';
  if(navigator.share){ try { await navigator.share({text: text, url: url}); return; } catch(err){ if(err && err.name === 'AbortError') return; } }
  try {
    await navigator.clipboard.writeText(text + ' ' + url);
    if(window.toast) window.toast(__t('feed.copied'));
  } catch(err){}
}
modal.addEventListener('click', async (e) => {
  if(e.target === modal || e.target.closest('[data-close-gallery]')){
    closeModal();
    return;
  }
  if(e.target.closest('[data-share-gallery]')){
    shareCheck(ME_NAME);
    return;
  }
  const del = e.target.closest('[data-delete-gallery]');
  if(!del) return;
  if(!window.confirm(__t('gallery.delete_confirm'))) return;
  const res = await fetch('/pump-check-gallery/' + del.dataset.deleteGallery, {method:'DELETE'});
  if(res.ok){
    closeModal();
    await loadGallery();
  }
});
document.addEventListener('keydown', (e) => {
  if(!modal.classList.contains('show')) return;
  if(e.key === 'Escape'){ closeModal(); return; }
  // Keep Tab inside the open detail: a dialog the keyboard can walk out of
  // leaves the user tabbing an inert page behind a scrim.
  if(e.key !== 'Tab') return;
  const stops = detail.querySelectorAll('button, [href]');
  if(!stops.length) return;
  const first = stops[0];
  const last = stops[stops.length - 1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});
loadGallery();
</script>
<script src="/static/actions.js"></script>
</body>
</html>
