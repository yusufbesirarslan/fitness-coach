{%- if coach_handoff %}
<aside id="coach-progress-context" aria-label="{{ t('coach.handoff_from_progress') }}">
    <span class="coach-progress-label">{{ t('coach.handoff_from_progress') }}</span>
    <p>{{ coach_handoff.preview }}</p>
    <p>{{ coach_handoff.action }}</p>
    <button type="button" id="coach-progress-dismiss">{{ t('coach.handoff_dismiss') }}</button>
</aside>
<script nonce="{{ csp_nonce }}">
(function () {
    var input = document.getElementById('cw-input');
    var context = document.getElementById('coach-progress-context');
    var composer = document.getElementById('cw-irow');
    if (!input || !context || !composer || !window.CW) return;
    composer.parentNode.insertBefore(context, composer);
    if (!input.value) input.value = {{ coach_handoff.draft|tojson }};
    window.CW.handoff = 'progress-insight';
    function clearContext() {
        context.remove();
        if (window.location.search === '?review=progress-insight') {
            window.history.replaceState(window.history.state, '', '/coach');
        }
    }
    document.addEventListener('coach:handoff-consumed', clearContext, { once: true });
    document.getElementById('coach-progress-dismiss').addEventListener('click', function () {
        window.CW.handoff = null;
        window.CW._lastHandoff = null;
        clearContext();
        input.focus();
    });
})();
</script>
{%- endif %}
