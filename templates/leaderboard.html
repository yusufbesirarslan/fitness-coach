<!DOCTYPE html>
<html lang="{{ locale }}" data-theme="dark">
<head>
    {% include "_head.html" %}
    <title>{{ t('leaderboard.page_title') }}</title>
    <link rel="stylesheet" href="/static/theme.css">
    <link rel="stylesheet" href="/static/nav.css">
    <link rel="stylesheet" href="/static/leaderboard.css">
</head>
<body class="page-body">

<div class="toast-wrap" id="toast-wrap"></div>

{% set nav_active = 'profile' %}
{% include "_nav.html" %}

<main class="main-content">
    <div class="page-hdr">
        <h1>{{ t('leaderboard.h1_a') }}<br><span>{{ t('leaderboard.h1_b') }}</span></h1>
        <p>{{ t('leaderboard.page_sub') }}</p>
    </div>

    <div class="lb-wrap">
        <div id="lb-countdown-wrap" class="lb-countdown-wrap">
            <span id="lb-countdown" class="lb-countdown" aria-live="polite"></span>
        </div>
        <div class="lb-controls">
            <select id="lb-zaman" class="lb-zaman" aria-label="{{ t('leaderboard.timeframe_aria') }}" data-action-change="fxValue" data-fn="setTimeframe">
                <option value="all_time">{{ t('leaderboard.all_time') }}</option>
                <option value="weekly">{{ t('leaderboard.weekly') }}</option>
            </select>
            <div class="lb-tabs">
                <button class="lb-tab active" data-scope="friends" data-action="loadBoard" data-args='["friends"]'>{{ t('leaderboard.tab_friends') }}</button>
                <button class="lb-tab" data-scope="global" data-action="loadBoard" data-args='["global"]'>{{ t('leaderboard.tab_global') }}</button>
            </div>
        </div>
        <div id="lb-list" class="lb-list">
            <div class="loading-text">{{ t('leaderboard.loading') }}</div>
        </div>
    </div>
</main>

<div id="lb-sticky" class="lb-sticky"><div class="lb-wrap"></div></div>

{% include "_actionbar.html" %}

<script nonce="{{ csp_nonce }}">
var __t = (window.t) || function (k, v) { return k; };
function toast(msg, type) {
    type = type || 'info';
    const wrap = document.getElementById('toast-wrap');
    const t = document.createElement('div');
    t.className = 'toast toast-' + type;
    t.textContent = msg;
    wrap.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
}

function escapeHTML(str) {
    const d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
}

function avatarHTML(pp, name) {
    if (pp) return '<div class="lb-avatar"><img src="' + escapeHTML(pp).replace(/"/g, '&quot;') + '" loading="lazy" decoding="async" alt=""></div>';
    const letter = (name || 'U')[0].toUpperCase();
    return '<div class="lb-avatar">' + escapeHTML(letter) + '</div>';
}

function rowHTML(e, isSticky) {
    const meClass = e.is_me ? ' me' : '';
    const rankClass = e.rank <= 3 ? (' rank-' + e.rank) : '';
    const sub = isSticky ? ('Lv ' + e.level + ' · ' + __t('leaderboard.you')) : ('Lv ' + e.level);
    return `
        <div class="lb-row${meClass}${rankClass}">
            <div class="lb-rank${rankClass}">${e.rank}</div>
            ${avatarHTML(e.profile_picture, e.full_name)}
            <div class="lb-id">
                <div class="lb-name">${escapeHTML(e.username)}</div>
                <div class="lb-sub">${escapeHTML(sub)}</div>
            </div>
            <div class="lb-stats">
                <div class="lb-xp">${Number(e.xp).toLocaleString(window.LOCALE === 'en' ? 'en-US' : 'tr-TR')} XP</div>
                <div class="lb-streak">🔥 ${e.streak}</div>
            </div>
        </div>`;
}

function emptyStateHTML() {
    return `
        <div class="empty-state">
            <div class="empty-icon">🤝</div>
            <div class="empty-title">${__t('leaderboard.empty_title')}</div>
            <div class="empty-desc">${__t('leaderboard.empty_desc')}</div>
            <a href="/friends" class="lb-cta">${__t('leaderboard.empty_cta')}</a>
        </div>`;
}

let currentScope = 'friends';
let currentTimeframe = 'all_time';

// ── Weekly countdown ──────────────────────────────────────────────
// Targets the weekly reset boundary in UTC. Change LB_RESET to adjust
// the reset day/time in one place if it ever moves.
const LB_RESET = { day: 0, hour: 23, minute: 59 };  // 0 = Sunday (UTC)
const DAY_MS = 24 * 60 * 60 * 1000;

function nextResetUTC(now) {
    now = now || new Date();
    const t = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(),
        LB_RESET.hour, LB_RESET.minute, 0, 0));
    t.setUTCDate(t.getUTCDate() + ((LB_RESET.day - now.getUTCDay() + 7) % 7));
    if (t.getTime() <= now.getTime()) t.setUTCDate(t.getUTCDate() + 7);  // already passed today → next week
    return t;
}

function formatRemaining(ms) {
    if (ms < 0) ms = 0;
    const totalMin = Math.floor(ms / 60000);
    const days = Math.floor(totalMin / (60 * 24));
    const hours = Math.floor((totalMin % (60 * 24)) / 60);
    const mins = totalMin % 60;
    return __t('leaderboard.countdown', { d: days, h: hours, m: mins });
}

function updateCountdown() {
    const el = document.getElementById('lb-countdown');
    if (!el) return;
    const ms = nextResetUTC() - new Date();
    el.textContent = formatRemaining(ms);
    el.classList.toggle('urgent', ms < DAY_MS);  // accent color under 24h
}

function applyCountdownVisibility() {
    const wrap = document.getElementById('lb-countdown-wrap');
    if (!wrap) return;
    const show = currentTimeframe === 'weekly';
    wrap.style.display = show ? 'flex' : 'none';
    if (show) updateCountdown();
}

function setTimeframe(tf) {
    currentTimeframe = tf;
    applyCountdownVisibility();
    loadBoard(currentScope);
}

async function loadBoard(scope) {
    currentScope = scope;
    document.querySelectorAll('.lb-tab').forEach(t =>
        t.classList.toggle('active', t.dataset.scope === scope));

    const list = document.getElementById('lb-list');
    const sticky = document.getElementById('lb-sticky');
    sticky.style.display = 'none';
    list.classList.remove('has-sticky');
    list.innerHTML = '<div class="loading-text">' + __t('leaderboard.loading') + '</div>';

    try {
        const res = await fetch('/leaderboard/data?scope=' + encodeURIComponent(scope) +
            '&timeframe=' + encodeURIComponent(currentTimeframe));
        const data = await res.json();

        if (data.no_friends) {
            list.innerHTML = emptyStateHTML();
            return;
        }
        if (!data.entries || !data.entries.length) {
            list.innerHTML = '<div class="loading-text">' + __t('leaderboard.no_ranking') + '</div>';
            return;
        }

        list.innerHTML = data.entries.map(e => rowHTML(e, false)).join('');

        if (!data.in_list && data.me) {
            sticky.querySelector('.lb-wrap').innerHTML = rowHTML(data.me, true);
            sticky.style.display = 'block';
            list.classList.add('has-sticky');
        }
    } catch (e) {
        list.innerHTML = '<div class="loading-text">' + __t('leaderboard.load_error') + '</div>';
    }
}

applyCountdownVisibility();
// Geri sayımı yalnızca sekme görünürken güncelle (pil/CPU — never-idle).
let _cdTimer = null;
function _startCountdown() {
    if (_cdTimer) clearInterval(_cdTimer);
    _cdTimer = setInterval(() => { if (currentTimeframe === 'weekly') updateCountdown(); }, 60000);
}
document.addEventListener('visibilitychange', () => {
    if (document.hidden) { clearInterval(_cdTimer); _cdTimer = null; }
    else { if (currentTimeframe === 'weekly') updateCountdown(); _startCountdown(); }
});
_startCountdown();

loadBoard('friends');
</script>
<script src="/static/actions.js"></script>
</body>
</html>
