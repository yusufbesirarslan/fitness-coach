<!DOCTYPE html>
<html lang="{{ locale }}" data-theme="dark">
<head>
    {% include "_head.html" %}
    <title>{{ t('verify.title') }} - AxisAI</title>
    <meta name="description" content="AxisAI hesabini dogrula - e-postana gonderilen kodu gir.">
    <link rel="stylesheet" href="/static/auth.css">
</head>
<body class="auth-body">
<div class="auth-shell">
    <header class="auth-topbar">
        <a class="auth-brand" href="/welcome" aria-label="AxisAI">
            <img src="/static/icon-holo.png" alt="">AxisAI
        </a>
        <div class="auth-controls">
            <div class="lang-switch" role="group" aria-label="{{ t('lang.aria') }}">
                <button type="button" class="lang-opt{% if locale == 'tr' %} on{% endif %}" data-action="setLang" data-args='["tr"]'>TR</button>
                <button type="button" class="lang-opt{% if locale == 'en' %} on{% endif %}" data-action="setLang" data-args='["en"]'>EN</button>
            </div>
            <button type="button" class="theme-toggle" data-action="toggleTheme" aria-label="{{ t('theme.aria') }}"></button>
        </div>
    </header>

    <main class="auth-main">
        <section class="auth-card" aria-labelledby="verify-title">
            <p class="auth-kicker">AxisAI</p>
            <h1 class="auth-title" id="verify-title">{{ t('verify.title') }}</h1>
            <p class="auth-subtitle">{{ t('verify.subtitle') }}</p>

            <div class="auth-alert auth-alert-error" id="error-msg" role="alert" aria-live="polite"></div>
            <div class="auth-alert auth-alert-success" id="success-msg" role="status" aria-live="polite"></div>

            <div class="auth-form">
                <div class="auth-field">
                    <label for="username">{{ t('form.username') }}</label>
                    <input type="text" id="username" name="username" value="{{ username }}"
                           placeholder="{{ t('verify.username_ph') }}" autocomplete="username"
                           autocapitalize="none" spellcheck="false" data-action-keydown="verifyOnEnter">
                </div>
                <div class="auth-field">
                    <label for="code">{{ t('verify.code_label') }}</label>
                    <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code"
                           placeholder="{{ t('verify.code_ph') }}" data-action-keydown="verifyOnEnter">
                </div>

                <button type="button" class="auth-btn" id="verify-submit" data-action="verifyCode">{{ t('verify.submit') }}</button>
                <button type="button" class="auth-btn auth-btn-secondary" data-action="resendCode">{{ t('verify.resend') }}</button>

                <div class="auth-row">
                    <span>{{ t('verify.no_code') }}</span>
                    <a class="auth-link" href="/login">{{ t('verify.back_login') }}</a>
                </div>
            </div>
        </section>
    </main>
</div>
<script src="/static/auth.js"></script>
<script src="/static/actions.js"></script>
</body>
</html>
