<!DOCTYPE html>
<html lang="{{ locale }}" data-theme="dark">
<head>
    {% include "_head.html" %}
    <title>{{ t('feed.page_title') }}</title>
    <link rel="stylesheet" href="/static/theme.css">
    <link rel="stylesheet" href="/static/nav.css">
    <link rel="stylesheet" href="/static/feed.css">
</head>
{% set nav_active = 'profile' %}
<body class="page-body">
<div class="toast-wrap" id="toast-wrap"></div>
{% include "_nav.html" %}
<main class="main-content">
    <div class="page-hdr">
        <h1>{{ t('feed.h1_a') }}<br><span>{{ t('feed.h1_b') }}</span></h1>
        <p>{{ t('feed.page_sub') }}</p>
    </div>
    <div class="feed-wrap" id="feed-list">
        <div class="feed-skeleton"></div>
        <div class="feed-skeleton"></div>
    </div>
</main>
<section class="comments-sheet" id="comments-sheet" hidden>
    <button class="comments-backdrop" type="button" id="comments-backdrop" aria-label="{{ t('feed.comments_close') }}"></button>
    <div class="comments-panel" role="dialog" aria-modal="true" aria-labelledby="comments-title">
        <div class="comments-head">
            <div class="comments-title" id="comments-title">{{ t('feed.comments_title') }}</div>
            <button class="comments-close" type="button" id="comments-close" aria-label="{{ t('feed.comments_close') }}">×</button>
        </div>
        <div class="comments-list" id="comments-list"></div>
        <form class="comments-compose" id="comments-form">
            <textarea class="comments-input" id="comments-input" maxlength="500" placeholder="{{ t('feed.comment_placeholder') }}"></textarea>
            <div class="comments-foot">
                <div class="comments-hint" id="comments-hint">{{ t('feed.comment_hint') }}</div>
                <button class="comments-submit" id="comments-submit" type="submit">{{ t('feed.comment_post') }}</button>
            </div>
        </form>
    </div>
</section>
{% include "_actionbar.html" %}
<script nonce="{{ csp_nonce }}">
var __t = window.t || function(k){ return k; };
let feedPage = 1;
let feedLoading = false;
let feedHasMore = true;
const feedList = document.getElementById('feed-list');
const commentsSheet = document.getElementById('comments-sheet');
const commentsBackdrop = document.getElementById('comments-backdrop');
const commentsClose = document.getElementById('comments-close');
const commentsList = document.getElementById('comments-list');
const commentsForm = document.getElementById('comments-form');
const commentsInput = document.getElementById('comments-input');
const commentsSubmit = document.getElementById('comments-submit');
const commentsHint = document.getElementById('comments-hint');
let activeCommentsId = null;
function esc(v){ const d=document.createElement('div'); d.textContent=v == null ? '' : String(v); return d.innerHTML; }
// location_type kanonik TR ('Ev'/'Spor Salonu') gelir; görünen etiket display-map ile çevrilir.
function envLabel(v){ const m = {'Ev': __t('training.loc_home'), 'Spor Salonu': __t('training.loc_gym')}; return m[v] || v; }
function avatar(post){ return post.userAvatar ? '<div class="feed-avatar"><img src="'+esc(post.userAvatar).replace(/"/g,'&quot;')+'" alt=""></div>' : '<div class="feed-avatar">'+esc((post.username||'U')[0].toUpperCase())+'</div>'; }
function commentAvatar(comment){ return comment.userAvatar ? '<div class="comment-avatar"><img src="'+esc(comment.userAvatar).replace(/"/g,'&quot;')+'" alt=""></div>' : '<div class="comment-avatar">'+esc((comment.username||'U')[0].toUpperCase())+'</div>'; }
function cardMedia(post){
  if(post.imageUrl){
    return '<img class="feed-img" src="'+esc(post.imageUrl).replace(/"/g,'&quot;')+'" loading="lazy" decoding="async" alt="">';
  }
  return '<div class="feed-img feed-img-fallback" aria-hidden="true"></div>';
}
function card(post){
  return '<article class="feed-card" data-id="'+post.id+'"><div class="feed-head">'+avatar(post)+'<div><div class="feed-user">'+esc(post.username)+'</div><div class="feed-time">'+esc(post.timePosted)+'</div></div></div>'+
    cardMedia(post)+
    '<div class="feed-body">'+
    (post.workoutScore != null ? '<div><div class="feed-label">'+__t('feed.workout_score')+'</div><div class="feed-value">'+esc(post.workoutScore)+'</div></div>' : '')+
    '<div><div class="feed-label">'+__t('feed.environment')+'</div><div class="feed-value">'+esc(envLabel(post.environment))+'</div></div>'+
    '<div><div class="feed-label">'+__t('feed.description')+'</div><div class="feed-value">'+esc(post.description)+'</div></div>'+
    '<div class="feed-actions"><button class="feed-action '+(post.likedByMe?'liked':'')+'" data-like="'+post.id+'">'+post.likesCount+' '+__t('feed.likes')+'</button><button class="feed-action" data-comments="'+post.id+'">'+commentCountLabel(post.commentsCount)+'</button></div></div></article>';
}
function commentCountLabel(count){
  return __t('feed.comments_count', {n: count});
}
function setCommentCount(id, count){
  const button = feedList.querySelector('[data-comments="'+id+'"]');
  if(button) button.textContent = commentCountLabel(count);
}
function renderComment(comment){
  return '<div class="comment-row">'+commentAvatar(comment)+'<div class="comment-card"><div class="comment-meta"><span class="comment-user">'+esc(comment.username)+'</span><span class="comment-time">'+esc(comment.createdAt || '')+'</span></div><div class="comment-body">'+esc(comment.body)+'</div></div></div>';
}
function setCommentsState(key){
  commentsList.innerHTML = '<div class="comments-state">'+esc(__t(key))+'</div>';
}
function openComments(id){
  activeCommentsId = id;
  commentsSheet.hidden = false;
  document.body.style.overflow = 'hidden';
  commentsInput.value = '';
  commentsHint.textContent = __t('feed.comment_hint');
  commentsInput.focus();
  loadComments(id);
}
function closeComments(){
  activeCommentsId = null;
  commentsSheet.hidden = true;
  document.body.style.overflow = '';
}
async function loadComments(id){
  setCommentsState('feed.comments_loading');
  try {
    const res = await fetch('/pump-check/' + id + '/comments');
    const data = await res.json();
    if(!res.ok){
      setCommentsState('feed.comments_error');
      return;
    }
    if(activeCommentsId !== id) return;
    if(!data.comments.length){
      setCommentsState('feed.comments_empty');
      return;
    }
    commentsList.innerHTML = data.comments.map(renderComment).join('');
    commentsList.scrollTop = commentsList.scrollHeight;
  } catch (err) {
    setCommentsState('feed.comments_error');
  }
}
async function loadFeed(){
  if(feedLoading || !feedHasMore) return;
  feedLoading = true;
  try {
    const res = await fetch('/feed/data?page=' + feedPage);
    const data = await res.json();
    if(feedPage === 1) feedList.innerHTML = '';
    if(!data.posts.length && feedPage === 1){
      feedList.innerHTML = '<div class="empty-state"><div class="empty-icon">📸</div><div class="empty-desc">'+__t('feed.empty')+'</div></div>';
    } else {
      feedList.insertAdjacentHTML('beforeend', data.posts.map(card).join(''));
    }
    feedHasMore = data.hasMore;
    feedPage = data.nextPage || feedPage;
  } finally {
    feedLoading = false;
  }
}
feedList.addEventListener('click', async (e) => {
  const like = e.target.closest('[data-like]');
  if(like){
    const id = like.dataset.like;
    const liked = like.classList.contains('liked');
    like.classList.add('is-busy');
    try {
      const res = await fetch('/pump-check/' + id + '/like', { method: liked ? 'DELETE' : 'POST' });
      const data = await res.json();
      if(res.ok){
        like.classList.toggle('liked', data.liked);
        like.textContent = data.likesCount + ' ' + __t('feed.likes');
      }
    } finally {
      like.classList.remove('is-busy');
    }
    return;
  }
  const comments = e.target.closest('[data-comments]');
  if(comments){
    openComments(comments.dataset.comments);
  }
});
commentsBackdrop.addEventListener('click', closeComments);
commentsClose.addEventListener('click', closeComments);
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && !commentsSheet.hidden) closeComments();
});
commentsForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  if(!activeCommentsId) return;
  const body = commentsInput.value.trim();
  if(!body){
    commentsHint.textContent = __t('feed.comment_empty');
    return;
  }
  commentsSubmit.disabled = true;
  commentsHint.textContent = __t('feed.comment_posting');
  try {
    const res = await fetch('/pump-check/' + activeCommentsId + '/comments', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({body: body})
    });
    const data = await res.json();
    if(!res.ok){
      commentsHint.textContent = data.error || __t('feed.comments_error');
      return;
    }
    commentsInput.value = '';
    commentsHint.textContent = __t('feed.comment_hint');
    setCommentCount(activeCommentsId, data.commentsCount || 0);
    await loadComments(activeCommentsId);
  } catch (err) {
    commentsHint.textContent = __t('feed.comments_error');
  } finally {
    commentsSubmit.disabled = false;
  }
});
window.addEventListener('scroll', () => { if(window.innerHeight + window.scrollY > document.body.offsetHeight - 500) loadFeed(); });
loadFeed();
</script>
<script src="/static/actions.js"></script>
</body>
</html>
