<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap — Fitness Coach</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .auth-wrapper {
            display:flex; align-items:center; justify-content:center;
            min-height:100vh; padding:40px 20px;
        }
        .auth-card {
            width:100%; max-width:420px; background:var(--card);
            border:1px solid var(--border); border-radius:16px;
            padding:40px 32px; position:relative; overflow:hidden;
        }
        .auth-card::before {
            content:''; position:absolute; top:0; left:0; right:0;
            height:2px; background:linear-gradient(90deg,var(--accent),transparent);
        }
        .auth-logo {
            font-family:'Bebas Neue',sans-serif; font-size:36px;
            letter-spacing:4px; color:var(--accent); text-align:center;
            margin-bottom:8px;
        }
        .auth-subtitle {
            font-size:14px; color:var(--text2); text-align:center;
            font-weight:300; margin-bottom:32px;
        }
        .auth-card .form-group { margin-bottom:16px; }
        .auth-card input {
            width:100%; font-size:15px; padding:14px 16px;
        }
        .auth-btn {
            font-family:'Bebas Neue',sans-serif; font-size:18px;
            letter-spacing:3px; color:#0a0a0a; background:var(--accent);
            border:none; border-radius:8px; padding:14px;
            cursor:pointer; transition:all 0.2s; width:100%; margin-top:8px;
        }
        .auth-btn:hover { background:var(--accent2); transform:translateY(-1px); }
        .auth-footer {
            text-align:center; margin-top:20px; font-size:14px;
            color:var(--text2); font-weight:300;
        }
        .auth-footer a {
            color:var(--accent); text-decoration:none;
            border-bottom:1px solid var(--accent-glow);
        }
        .auth-footer a:hover { border-bottom-color:var(--accent); }
        .auth-error {
            background:rgba(255,107,107,0.1); border:1px solid var(--red,#ff6b6b);
            color:var(--red,#ff6b6b); border-radius:8px; padding:12px 16px;
            font-size:14px; margin-bottom:16px; display:none;
        }
        .theme-corner {
            position:fixed; top:20px; right:20px;
        }
    </style>
</head>
<body>

    <div class="theme-corner">
        <button class="theme-toggle" onclick="toggleTheme()"></button>
    </div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">FITNESS COACH</div>
            <div class="auth-subtitle">Hesabına giriş yap</div>

            <div class="auth-error" id="error-msg"></div>

            <div class="form-group">
                <label>Kullanıcı Adı</label>
                <input type="text" id="username" placeholder="Kullanıcı Adın">
            </div>
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" id="password" placeholder="Şifren">
            </div>

            <button class="auth-btn" onclick="login()">GİRİŞ YAP</button>

            <div class="auth-footer">
                Hesabın yok mu? <a href="/register">Kayıt ol</a>
            </div>
        </div>
    </div>

    <script>
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.dataset.theme = savedTheme;
        function toggleTheme() {
            const html = document.documentElement;
            html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', html.dataset.theme);
        }

        async function login() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            const response = await fetch("/login", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (response.ok) {
                window.location.href = "/";
            } else {
                const errorDiv = document.getElementById("error-msg");
                errorDiv.textContent = data.error;
                errorDiv.style.display = "block";
            }
        }

        document.getElementById("password").addEventListener("keydown", e => {
            if (e.key === "Enter") login();
        });
    </script>

</body>
</html>
