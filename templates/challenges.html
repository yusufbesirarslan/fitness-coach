<!DOCTYPE html>
<html lang="{{ locale }}" data-theme="dark">
<head>
    {% include "_head.html" %}
    <title>{{ t('challenge.page_title') }}</title>
    <link rel="stylesheet" href="/static/theme.css">
    <link rel="stylesheet" href="/static/nav.css">
    <link rel="stylesheet" href="/static/challenges.css">
</head>
<body class="page-body">
<div class="toast-wrap" id="toast-wrap"></div>

{% set nav_active = 'profile' %}
{% include "_nav.html" %}

<main class="main-content">
    <div class="page-hdr">
        <h1>{{ t('challenge.h1_a') }}<span>{{ t('challenge.h1_b') }}</span></h1>
        <p>{{ t('challenge.page_sub') }}</p>
    </div>

    <div class="ch-countdown" id="ch-countdown" hidden></div>

    <section class="ch-badges" id="ch-badges" hidden>
        <div class="ch-section-title">{{ t('challenge.badges_title') }}</div>
        <div class="ch-badge-strip" id="ch-badge-strip"></div>
    </section>

    <div id="challenges-root">
        <div class="ch-skeleton"></div>
        <div class="ch-skeleton"></div>
    </div>
</main>

<!-- Leaderboard sheet -->
<section class="ch-sheet" id="ch-lb-sheet" hidden>
    <button class="ch-sheet-backdrop" type="button" id="ch-lb-backdrop" aria-label="{{ t('challenge.lb_close') }}"></button>
    <div class="ch-sheet-panel" role="dialog" aria-modal="true" aria-labelledby="ch-lb-title">
        <div class="ch-sheet-head">
            <div class="ch-sheet-title" id="ch-lb-title">{{ t('challenge.lb_title') }}</div>
            <button class="ch-sheet-close" type="button" id="ch-lb-close" aria-label="{{ t('challenge.lb_close') }}">×</button>
        </div>
        <div class="ch-lb-tabs">
            <button class="ch-lb-tab active" type="button" data-scope="global">{{ t('challenge.lb_global') }}</button>
            <button class="ch-lb-tab" type="button" data-scope="friends">{{ t('challenge.lb_friends') }}</button>
        </div>
        <div class="ch-lb-list" id="ch-lb-list"></div>
    </div>
</section>

{% include "_actionbar.html" %}
<script nonce="{{ csp_nonce }}">
const ME = {{ current_user.id|tojson }};
var __t = window.t || function(k){ return k; };
function esc(v){ const d=document.createElement('div'); d.textContent=v == null ? '' : String(v); return d.innerHTML; }
function q(v){ return esc(v).replace(/"/g,'&quot;'); }

const root = document.getElementById('challenges-root');
let __endsAt = null;   // Date | null

function toast(msg){
    const wrap = document.getElementById('toast-wrap');
    if(!wrap) return;
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    wrap.appendChild(el);
    setTimeout(function(){ el.remove(); }, 2600);
}

// ── Geri sayım (periodEndsAt = Pazar 23:59 Istanbul → UTC) ────────────────────
function updateCountdown(){
    const el = document.getElementById('ch-countdown');
    if(!el || !__endsAt){ return; }
    let ms = __endsAt.getTime() - Date.now();
    if(ms < 0) ms = 0;
    const totalMin = Math.floor(ms / 60000);
    const d = Math.floor(totalMin / (60*24));
    const h = Math.floor((totalMin % (60*24)) / 60);
    const m = totalMin % 60;
    el.textContent = __t('challenge.ends_in', {d: d, h: h, m: m});
    el.hidden = false;
}

// ── Kart ──────────────────────────────────────────────────────────────────────
function progressBar(cur, target, completed){
    const pct = target > 0 ? Math.min(100, Math.round((cur / target) * 100)) : 0;
    return '<div class="ch-bar-track"><div class="ch-bar'+(completed?' done':'')+'" style="width:'+pct+'%"></div></div>'+
        '<div class="ch-progress-label">'+__t('challenge.progress_label', {cur: cur, target: target})+'</div>';
}

function cardHtml(c){
    let foot;
    if(c.completed){
        foot = '<span class="ch-status done">✓ '+__t('challenge.completed')+'</span>';
    } else if(c.type === 'featured' && !c.joined){
        foot = '<button class="ch-join" type="button" data-act="join" data-id="'+c.id+'">'+__t('challenge.join')+'</button>';
    } else if(c.type === 'featured'){
        foot = '<span class="ch-status joined">'+__t('challenge.joined')+'</span>';
    } else {
        foot = '<span class="ch-status">'+__t('challenge.active')+'</span>';
    }
    const badge = c.badgeIcon ? '<span class="ch-card-badge" title="'+q(c.badgeCode)+'">'+esc(c.badgeIcon)+'</span>' : '';
    return '<article class="ch-card'+(c.completed?' is-done':'')+'" data-id="'+c.id+'">'+
        '<div class="ch-card-head">'+badge+
            '<div class="ch-card-title">'+esc(c.title)+'</div>'+
            '<div class="ch-card-xp">+'+esc(c.xpReward)+' XP</div>'+
        '</div>'+
        '<div class="ch-card-desc">'+esc(c.description)+'</div>'+
        progressBar(c.progress, c.target, c.completed)+
        '<div class="ch-card-foot">'+foot+
            '<button class="ch-lb-btn" type="button" data-act="board" data-id="'+c.id+'">'+__t('challenge.leaderboard')+'</button>'+
        '</div>'+
    '</article>';
}

function groupHtml(titleKey, list){
    if(!list.length) return '';
    return '<div class="ch-section-title">'+__t(titleKey)+'</div>'+
        '<div class="ch-grid">'+list.map(cardHtml).join('')+'</div>';
}

function renderBadges(badges){
    const sec = document.getElementById('ch-badges');
    const strip = document.getElementById('ch-badge-strip');
    if(!badges || !badges.length){ sec.hidden = true; return; }
    strip.innerHTML = badges.map(function(b){
        return '<div class="ch-badge" title="'+q(__t(b.titleKey))+'"><span class="ch-badge-icon">'+esc(b.icon)+
            '</span><span class="ch-badge-name">'+esc(__t(b.titleKey))+'</span></div>';
    }).join('');
    sec.hidden = false;
}

async function loadData(){
    try {
        const res = await fetch('/challenges/data');
        const data = await res.json();
        if(data.periodEndsAt){ __endsAt = new Date(data.periodEndsAt); updateCountdown(); }
        renderBadges(data.badges);
        const list = data.challenges || [];
        const globals = list.filter(function(c){ return c.type !== 'featured'; });
        const featured = list.filter(function(c){ return c.type === 'featured'; });
        if(!list.length){
            root.innerHTML = '<div class="empty-state"><div class="empty-icon">🏆</div><div class="empty-desc">'+__t('challenge.empty')+'</div></div>';
            return;
        }
        root.innerHTML = groupHtml('challenge.featured', featured) + groupHtml('challenge.global', globals);
    } catch(err){
        root.innerHTML = '<div class="empty-state"><div class="empty-desc">'+__t('challenge.load_error')+'</div></div>';
    }
}

// ── Etkileşim ───────────────────────────────────────────────────────────────
root.addEventListener('click', function(e){
    const btn = e.target.closest('[data-act]');
    if(!btn) return;
    if(btn.dataset.act === 'join') return joinChallenge(btn);
    if(btn.dataset.act === 'board') return openBoard(btn.dataset.id);
});

async function joinChallenge(btn){
    const id = btn.dataset.id;
    btn.disabled = true;
    try {
        const res = await fetch('/challenges/'+id+'/join', {method: 'POST'});
        const data = await res.json();
        if(res.ok && data.joined){ toast(__t('challenge.joined')); loadData(); }
        else { btn.disabled = false; toast(data.error || __t('challenge.join_error')); }
    } catch(err){ btn.disabled = false; toast(__t('challenge.join_error')); }
}

// ── Leaderboard sheet ─────────────────────────────────────────────────────────
const lbSheet = document.getElementById('ch-lb-sheet');
const lbList = document.getElementById('ch-lb-list');
let lbId = null, lbScope = 'global';

function openBoard(id){
    lbId = id; lbScope = 'global';
    lbSheet.querySelectorAll('.ch-lb-tab').forEach(function(t){ t.classList.toggle('active', t.dataset.scope === 'global'); });
    lbSheet.hidden = false; document.body.style.overflow = 'hidden';
    loadBoard();
}
function closeBoard(){ lbSheet.hidden = true; lbId = null; document.body.style.overflow = ''; }

function rowHtml(e){
    const you = e.user_id === ME;
    const rank = e.rank != null ? ('#'+e.rank) : '–';
    const av = e.profile_picture ? '<img class="ch-lb-avatar" src="'+q(e.profile_picture)+'" alt="">'
        : '<span class="ch-lb-avatar ch-lb-avatar-fb">'+esc((e.username||'U')[0].toUpperCase())+'</span>';
    const done = e.completed ? '<span class="ch-lb-done">✓</span>' : '';
    return '<div class="ch-lb-row'+(you?' me':'')+'"><span class="ch-lb-rank">'+esc(rank)+'</span>'+av+
        '<span class="ch-lb-name">'+esc(e.full_name || e.username)+(you?(' <em>'+__t('challenge.lb_you')+'</em>'):'')+'</span>'+
        '<span class="ch-lb-prog">'+esc(e.progress)+' '+done+'</span></div>';
}

async function loadBoard(){
    if(!lbId) return;
    lbList.innerHTML = '<div class="ch-lb-state">'+__t('challenge.loading')+'</div>';
    try {
        const res = await fetch('/challenges/'+lbId+'/leaderboard?scope='+encodeURIComponent(lbScope));
        const data = await res.json();
        if(!res.ok){ lbList.innerHTML = '<div class="ch-lb-state">'+__t('challenge.load_error')+'</div>'; return; }
        let rows = (data.entries || []).map(rowHtml).join('');
        if(!rows){ rows = '<div class="ch-lb-state">'+__t('challenge.lb_empty')+'</div>'; }
        if(!data.in_list && data.me){ rows += '<div class="ch-lb-sticky">'+rowHtml(data.me)+'</div>'; }
        lbList.innerHTML = rows;
    } catch(err){ lbList.innerHTML = '<div class="ch-lb-state">'+__t('challenge.load_error')+'</div>'; }
}

lbSheet.querySelectorAll('.ch-lb-tab').forEach(function(tab){
    tab.addEventListener('click', function(){
        lbScope = tab.dataset.scope === 'friends' ? 'friends' : 'global';
        lbSheet.querySelectorAll('.ch-lb-tab').forEach(function(t){ t.classList.toggle('active', t === tab); });
        loadBoard();
    });
});
document.getElementById('ch-lb-backdrop').addEventListener('click', closeBoard);
document.getElementById('ch-lb-close').addEventListener('click', closeBoard);
document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && !lbSheet.hidden) closeBoard(); });

// ── Init ────────────────────────────────────────────────────────────────────
let _cdTimer = setInterval(updateCountdown, 60000);
document.addEventListener('visibilitychange', function(){
    if(document.hidden){ clearInterval(_cdTimer); _cdTimer = null; }
    else if(!_cdTimer){ updateCountdown(); _cdTimer = setInterval(updateCountdown, 60000); }
});
loadData();
</script>
<script src="/static/actions.js"></script>
</body>
</html>
