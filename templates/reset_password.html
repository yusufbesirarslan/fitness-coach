<!DOCTYPE html>
<html lang="{{ locale }}" data-theme="dark">
<head>
    {% include "_head.html" %}
    <title>{{ t('reset.title') }} - AxisAI</title>
    <meta name="description" content="{{ t('reset.subtitle') }}">
    <link rel="stylesheet" href="/static/auth.css">
</head>
<body class="auth-body">
<div class="auth-shell">
    <header class="auth-topbar">
        <a class="auth-brand" href="/welcome" aria-label="AxisAI">
            <img src="/static/icon-holo.png" alt="">AxisAI
        </a>
        <div class="auth-controls">
            <div class="lang-switch" role="group" aria-label="{{ t('lang.aria') }}">
                <button type="button" class="lang-opt{% if locale == 'tr' %} on{% endif %}" data-action="setLang" data-args='["tr"]'>TR</button>
                <button type="button" class="lang-opt{% if locale == 'en' %} on{% endif %}" data-action="setLang" data-args='["en"]'>EN</button>
            </div>
            <button type="button" class="theme-toggle" data-action="toggleTheme" aria-label="{{ t('theme.aria') }}"></button>
        </div>
    </header>

    <main class="auth-main">
        <section class="auth-card" aria-labelledby="reset-title">
            <p class="auth-kicker">AxisAI</p>
            <h1 class="auth-title" id="reset-title">{{ t('reset.title') }}</h1>
            <p class="auth-subtitle">{{ t('reset.subtitle') }}</p>

            <div class="auth-alert auth-alert-error" id="error-msg" role="alert" aria-live="polite"></div>
            <div class="auth-alert auth-alert-success" id="success-msg" role="status" aria-live="polite"></div>

            <div class="auth-form">
                <div class="auth-field">
                    <label for="code">{{ t('reset.code') }}</label>
                    <input type="text" id="code" name="code" inputmode="numeric"
                           autocomplete="one-time-code" placeholder="{{ t('reset.code_ph') }}"
                           data-action-keydown="resetPasswordOnEnter">
                </div>

                <div class="auth-field">
                    <label for="password">{{ t('reset.new_password') }}</label>
                    <div class="auth-input-wrap">
                        <input type="password" id="password" name="password"
                               autocomplete="new-password" placeholder="{{ t('reset.password_ph') }}"
                               aria-describedby="password-help password-strength-text"
                               data-action-input="updatePasswordStrength"
                               data-action-keydown="resetPasswordOnEnter">
                        <button type="button" class="password-toggle" data-action="togglePassword"
                                data-target="password" aria-label="{{ t('reset.new_password') }}"
                                aria-pressed="false">Show</button>
                    </div>
                    <div class="password-meter" id="password-strength" data-score="0" aria-hidden="true">
                        <div class="password-track"><div class="password-fill"></div></div>
                    </div>
                    <p class="password-hint" id="password-help">{{ t('reset.password_ph') }}</p>
                    <p class="password-hint" id="password-strength-text" aria-live="polite"></p>
                </div>

                <div class="auth-field">
                    <label for="confirm-password">{{ t('reset.confirm_password') }}</label>
                    <div class="auth-input-wrap">
                        <input type="password" id="confirm-password" name="confirm-password"
                               autocomplete="new-password" placeholder="{{ t('reset.confirm_password_ph') }}"
                               data-action-keydown="resetPasswordOnEnter">
                        <button type="button" class="password-toggle" data-action="togglePassword"
                                data-target="confirm-password" aria-label="{{ t('reset.confirm_password') }}"
                                aria-pressed="false">Show</button>
                    </div>
                </div>

                <button type="button" class="auth-btn" id="reset-submit"
                        data-action="resetPassword">{{ t('reset.submit') }}</button>
            </div>
        </section>
    </main>
</div>
<script src="/static/auth.js"></script>
<script src="/static/actions.js"></script>
</body>
</html>
