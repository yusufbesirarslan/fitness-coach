name: Deploy to EC2

# H3: deploy artık CI'a KAPILI. Eskiden `push: main` ile tetikleniyordu ve
# ci.yml ile PARALEL koşuyordu (ne `needs:` ne `workflow_run:` vardı) — yani
# testleri kıran bir commit prod'a gidebiliyordu; önündeki tek engel mantık
# regresyonunu göremeyen /health gate idi. workflow_run ile deploy YALNIZCA CI
# yeşil bittiğinde başlar. (main branch koruması ayrıca elle açılmalı: bu, merge
# kapısıdır; buradaki gate ise deploy kapısı.)
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false
  queue: single

env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # CI basarisizsa deploy hic calismaz.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}

      # H4: havuz IaC'de degil (konsol-yonetimli). Uygulamanin kimlik saglayicisi
      # hakkindaki VARSAYIMLARINI (PreventUserExistenceErrors ACIK, MFA KAPALI,
      # dogru auth flow'lar) her deploy'da dogrula. Simdilik BLOKLAMAZ: deploy
      # rolune cognito-idp:DescribeUserPool* eklendikten sonra continue-on-error
      # kaldirilip bloklayici yapilmali.
      - name: Cognito pool config drift check (non-blocking)
        continue-on-error: true
        env:
          COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID || 'eu-central-1_kaX0SORRK' }}
          COGNITO_APP_CLIENT_ID: ${{ vars.COGNITO_APP_CLIENT_ID || '3rdtrk3vl1dp0m1d19gdc3pqib' }}
        run: |
          pip install --quiet boto3
          python scripts/check_cognito_pool.py

      # 2026-07-13: `sam build` atlanarak deploy edilen Lambda bagimliliklari
      # VENDOR ETMEDI; handler istisnalari yuttugu icin Cognito trigger'i BASARILI
      # sayildi ve auth e-postalari SESSIZCE hic gitmedi (kimse kayit olamadi).
      # Artifact'i her deploy'da denetle. Simdilik BLOKLAMAZ: deploy rolune
      # lambda:GetFunction eklendikten sonra continue-on-error kaldirilmali.
      - name: CustomEmailSender Lambda package check (non-blocking)
        continue-on-error: true
        env:
          COGNITO_EMAIL_LAMBDA_NAME: ${{ vars.COGNITO_EMAIL_LAMBDA_NAME || 'axisai-cognito-email-sender-EmailSenderFunction-hL04ENGVLu1E' }}
        run: |
          pip install --quiet boto3
          python scripts/check_email_lambda.py

      # M5: rollback KODU geri alir ama boot'ta uygulanan DB migration'larini
      # GERI ALMAZ (bkz. CLAUDE.md A2). Gercek kullanici verisi varken bu,
      # kurtarilamaz bir olaya donusebilir. Deploy oncesi ucuz bir snapshot,
      # kurtarilamaz olayi kurtarilabilir hale getirir. vars.RDS_INSTANCE_ID
      # tanimli degilse ya da rolde rds:CreateDBSnapshot yoksa: uyar, gecme.
      - name: Pre-deploy RDS snapshot (non-blocking)
        continue-on-error: true
        run: |
          RDS_ID="${{ vars.RDS_INSTANCE_ID }}"
          if [ -z "$RDS_ID" ]; then
            echo "UYARI: vars.RDS_INSTANCE_ID tanimli degil - deploy oncesi snapshot ATLANDI."
            echo "Yikici bir migration geri alinamaz (A2). Degiskeni tanimlayin ve deploy rolune rds:CreateDBSnapshot verin."
            exit 0
          fi
          SNAP_ID="predeploy-${RDS_ID}-$(date -u +%Y%m%d%H%M%S)"
          echo "RDS snapshot aliniyor: $SNAP_ID"
          aws rds create-db-snapshot \
            --db-instance-identifier "$RDS_ID" \
            --db-snapshot-identifier "$SNAP_ID" \
            --query "DBSnapshot.DBSnapshotIdentifier" --output text
          echo "Snapshot baslatildi (arka planda tamamlanir): $SNAP_ID"

      - name: Deploy exact CI-approved revision via AWS SSM
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          PUBLIC_HEALTH_URL: ${{ vars.PUBLIC_HEALTH_URL }}
        run: python scripts/deploy_control.py
