name: CI

# Test paketi + şema-drift guard'ı. Deploy (deploy.yml) yalnızca main'e push'ta
# çalışır; bu workflow PR'larda ve main'de testleri ve migration tutarlılığını
# doğrular (TRIAGE #16).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    name: pytest shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"   # Dockerfile ile aynı taban
          cache: pip
      - name: Install dependencies
        # Dependency outages fail the required gate instead of hanging a runner.
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Run tests
        # conftest.py tüm env'i hermetik kurar (in-memory SQLite, sahte anahtarlar,
        # REDIS_URL boş) → ek servise gerek yok.
        run: >-
          python -m pytest -q --durations=50 -p scripts.pytest_sharding
          --ci-shard=${{ matrix.shard }}
          --ci-manifest=shard-evidence/shard-${{ matrix.shard }}.json
      - name: Upload execution and profiling evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-shard-${{ github.run_attempt }}-${{ matrix.shard }}
          path: shard-evidence/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 14

  pytest-gate:
    name: pytest
    runs-on: ubuntu-latest
    needs: [tests]
    if: ${{ always() }}
    steps:
      - name: Require successful completion of every shard
        env:
          SHARD_RESULT: ${{ needs.tests.result }}
        run: test "$SHARD_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install verifier dependency
        run: python -m pip install pytest==9.1.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pytest-shard-${{ github.run_attempt }}-*
          path: shard-evidence
          merge-multiple: true
      - name: Prove exact collection and execution parity
        env:
          SHARD_RESULT: ${{ needs.tests.result }}
        run: >-
          python -m scripts.pytest_sharding shard-evidence
          --revision="$GITHUB_SHA" --result="$SHARD_RESULT"

  linux-production-locks:
    name: authoritative Linux production locks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Prove root Linux OFD contention and release
        run: >-
          sudo -E "$(command -v python)" -m pytest -o addopts= -q
          -m "linux_lock or linux_helper_identity" --run-authoritative-linux-lock-tests
          tests/test_production_deploy_script.py

  image-revision-authority:
    name: authoritative image revision immutability
    # Revizyon değişmezliğinin OTORİTER kanıtı BURASIDIR — Dockerfile KAYNAK
    # METNİNİ tarayan tests/test_deploy_workflow.py tripwire'ı değil. Burada
    # gerçek imaj build edilir ve GERÇEK dosya sistemi iddia edilir, yani
    # kontrol MEKANİZMADAN BAĞIMSIZDIR: `install -d -m 0777`, `setfacl`,
    # heredoc RUN, yol ile çağrılan bir script, kabuk değişkeninden kurulan
    # komut adı, `tar` ile sahiplik geri yükleme ve çok aşamalı bir "decoy"
    # stage — hepsi aşağıdaki iddiaları bozar ve guard'ın hiçbirini TANIMASI
    # gerekmez.
    runs-on: ubuntu-latest
    env:
      IMAGE: axisai-revision-guard:ci
      # Dockerfile bu değeri doğrular (40 küçük-harf hex, aksi halde exit 64);
      # sentetik ama GEÇERLİ sabit bir literal.
      BUILD_REVISION: 0123456789abcdef0123456789abcdef01234567
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the production image with a synthetic revision
        shell: bash
        run: |
          set -euo pipefail
          docker build --build-arg BUILD_REVISION="$BUILD_REVISION" -t "$IMAGE" .
      - name: Assert the built image denies appuser any write to BUILD_REVISION
        shell: bash
        run: |
          set -euo pipefail

          fail() {
            echo "FAIL: $*" >&2
            exit 1
          }

          # 1 — KİMLİK. Gönderilen stage'in KENDİ çalışma-zamanı kimliği;
          # gönderilmeyen bir decoy stage bunu taklit edemez.
          identity="$(docker run --rm "$IMAGE" id -un)"
          if [ "$identity" != "appuser" ]; then
            fail "default image user is '$identity', expected 'appuser'"
          fi
          echo "OK identity: default user is appuser"

          # 2 — SAHİPLİK + MOD (root olarak okunur; iddia metadata'nın kendisi).
          stat_out="$(docker run --rm --user root "$IMAGE" \
            stat -c '%U:%G %a' /app /app/BUILD_REVISION)"
          dir_stat="$(printf '%s\n' "$stat_out" | sed -n '1p')"
          file_stat="$(printf '%s\n' "$stat_out" | sed -n '2p')"
          if [ "$dir_stat" != "root:root 755" ]; then
            fail "/app is '$dir_stat', expected 'root:root 755'"
          fi
          if [ "$file_stat" != "root:root 444" ]; then
            fail "/app/BUILD_REVISION is '$file_stat', expected 'root:root 444'"
          fi
          echo "OK metadata: /app='$dir_stat' /app/BUILD_REVISION='$file_stat'"

          # 3 — İÇERİK: build arg'ın BİREBİR kendisi.
          baked="$(docker run --rm "$IMAGE" cat /app/BUILD_REVISION)"
          if [ "$baked" != "$BUILD_REVISION" ]; then
            fail "/app/BUILD_REVISION holds '$baked', expected '$BUILD_REVISION'"
          fi
          echo "OK content: baked revision equals the build arg"

          # 4 — YÜK TAŞIYAN YARISI: imajın VARSAYILAN kullanıcısı olarak her
          # mutasyon denemesi BAŞARISIZ olmalı. `set -e` BEKLENEN bir
          # başarısızlıkta tetiklenmez, bu yüzden açıkça ters çeviriyoruz.
          deny() {
            local label="$1"
            shift
            if docker run --rm "$IMAGE" "$@"; then
              fail "appuser was ALLOWED to $label (command: $*)"
            fi
            echo "OK denied: $label"
          }

          deny "unlink /app/BUILD_REVISION" rm -f /app/BUILD_REVISION
          deny "rename /app/BUILD_REVISION" mv /app/BUILD_REVISION /app/stolen
          deny "overwrite /app/BUILD_REVISION content" \
            sh -c 'printf x > /app/BUILD_REVISION'
          deny "create a new entry in /app" touch /app/newly-created-file
          deny "create a symlink in /app" ln -s /evil /app/BUILD_REVISION-link

          # 5 — Beşinin HEPSİNİ TEK konteynerde dene ve dosyanın AYNI konteyner
          # içinde hâlâ var + DEĞİŞMEMİŞ olduğunu, hiçbir artık girdi
          # oluşmadığını doğrula (her `docker run` taze bir konteyner olduğu
          # için 4. adım tek başına bunu göstermez).
          after="$(docker run --rm "$IMAGE" sh -c '
            ( rm -f /app/BUILD_REVISION ) 2>/dev/null || true
            ( mv /app/BUILD_REVISION /app/stolen ) 2>/dev/null || true
            ( printf x > /app/BUILD_REVISION ) 2>/dev/null || true
            ( touch /app/newly-created-file ) 2>/dev/null || true
            ( ln -s /evil /app/BUILD_REVISION-link ) 2>/dev/null || true
            echo "revision=$(cat /app/BUILD_REVISION)"
            for leftover in /app/stolen /app/newly-created-file /app/BUILD_REVISION-link
            do
              if [ -e "$leftover" ] || [ -L "$leftover" ]; then
                echo "leftover=$leftover"
              fi
            done
          ')"
          if [ "$after" != "revision=$BUILD_REVISION" ]; then
            fail "after all five attempts in ONE container the image reported <$after>, expected exactly <revision=$BUILD_REVISION>"
          fi
          echo "OK survivability: file present, unchanged, no leftover entries"

  r6-slot-docker-integration:
    name: r6 two-slot web runtime (docker)
    # R6-01B live proof on a disposable Docker host: the real docker-compose.yml
    # main project (legacy web + worker + redis + throwaway postgres) plus the
    # blue/green slot projects driven only through scripts/web_slot_runtime.py.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Two web slots on one Docker host
        env:
          FITX_R6_DOCKER_IT: "1"
        run: python -m pytest -v -p no:cacheprovider tests/test_r6_slot_docker_integration.py

  r6-nginx-integration:
    name: r6 nginx route control plane (real nginx)
    # R6-02A live proof on a disposable, unprivileged nginx under the job's
    # temp dir: real route switches between three loopback backends, an
    # in-flight response drained across the graceful reload, the
    # behaviour-preserving bootstrap of the exact audited live Certbot site,
    # and Certbot's own nginx parser (pinned to production's 4.0.0) seeing
    # identical virtual hosts. The system nginx is stopped and never used.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install nginx, openssl and the Certbot parser
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx openssl
          sudo systemctl stop nginx || true
          python -m pip install pytest==9.1.1 PyYAML==6.0.3 certbot==4.0.0 certbot-nginx==4.0.0
      - name: Real nginx switch, graceful drain, bootstrap and Certbot gate
        env:
          FITX_R6_NGINX_IT: "1"
          FITX_R6_NGINX_BIN: /usr/sbin/nginx
          FITX_R6_CERTBOT_GATE: "1"
        run: >-
          python -m pytest -v -p no:cacheprovider --noconftest -o addopts=
          tests/test_r6_nginx_integration.py tests/test_r6_nginx_route_control.py
          tests/test_r6_nginx_bootstrap.py tests/test_r6_nginx_slot_contract.py

  migration-drift:
    name: schema-drift guard
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitx_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # FITX_SKIP_DB_INIT=1 → boot'taki create_all + ham ALTER'lar atlanır; şema
      # YALNIZCA Alembic zincirinden gelir. Böylece "modeller migration head'iyle
      # uyuşuyor mu?" sorusu anlamlı olur (create_all şemayı modellerden kursa
      # kontrol her zaman yeşil olurdu — anlamsız).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fitx_ci
      SECRET_KEY: ci-secret-not-used
      OPENAI_API_KEY: ci-key-not-used
      FATSECRET_BASE_URL: https://fatsecret.invalid
      REDIS_URL: ""
      BEDROCK_ENABLED: "0"
      S3_BUCKET_NAME: ""
      COGNITO_USER_POOL_ID: ""
      COGNITO_APP_CLIENT_ID: ""
      # Synthetic CI-only derivation root. Mobile auth config is boot-validated
      # even though this job never issues credentials or calls Cognito.
      MOBILE_AUTH_ACTIVE_DERIVATION_KEY_VERSION: ci-v1
      MOBILE_AUTH_DERIVATION_KEYRING: >-
        {"ci-v1":"Y2ktb25seS1tb2JpbGUtZGVyaXZhdGlvbi1yb290LTAx"}
      FITX_SKIP_DB_INIT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Apply Alembic migration chain
        run: flask --app starter db upgrade
      - name: Check models match migration head
        # `flask db check`, modellerle (app/models.py) migration head'i arasında bir
        # autogenerate farkı varsa sıfır-olmayan kodla döner → bir model değişikliği
        # migration'a yansıtılmamış demektir (CLAUDE.md şema-değişikliği akışının
        # gözden kaçırdığı durum).
        #
        # I-M1 ile ham ALTER'lar migration zincirine taşındı ve drift sıfırlandı →
        # bu guard artık BLOKLAYICI (continue-on-error kaldırıldı). Bir model
        # değişikliği migration'sız gelirse CI kırmızı olur.
        run: flask --app starter db check

  mobile-pg-concurrency:
    name: PostgreSQL concurrency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitx_mobile_race
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FITX_PG_CONCURRENCY_TEST: "1"
      PG_TEST_DATABASE_URL: >-
        postgresql://postgres:postgres@localhost:5432/fitx_mobile_race
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run deterministic races
        run: >-
          python -m pytest -m pg_concurrency -q
          tests/test_mobile_auth_pg.py
          tests/test_mobile_log_food_pg.py
          tests/test_mobile_training_generation_pg.py
          tests/test_mobile_diary_mutation_pg.py
          tests/test_mobile_pump_check_pg.py
          tests/test_mobile_pump_check_comparison_pg.py
          tests/test_mobile_pump_check_history_pg.py
          tests/test_plan_mutation_history_pg.py
          tests/test_training_plan_replacement_pg.py
          tests/test_lp18_b0_pg.py
          tests/test_plan_confirmation_pg.py
          tests/test_diary_provider_truth_pg.py
          tests/test_mobile_workout_sessions_pg.py
          tests/test_ti01b_exercise_notes_pg.py
          tests/test_workout_completion_pg.py
          tests/test_workout_session_pg.py
          tests/test_nutrition_vnext_pr7_pg.py
          tests/test_account_deletion_pg.py
          tests/test_progress_pump_check_completion_pg.py
          tests/test_checkin_integrity_pg.py
          tests/test_lp16a_weekly_checkin_pg.py
          tests/test_lp16b_native_checkin_pg.py
          tests/test_sprint14_workout_execution_reliability_pg.py
          tests/test_ti01a_execution_context_pg.py
          tests/test_ti03_pg.py
          tests/test_ux3_pr4_nutrition_placement_pg.py
          tests/test_f11_error_handler_pg.py
          tests/test_f12_web_session_refresh_pg.py
          tests/test_account_profile_pg.py
          tests/test_quest_challenge_commit_pg.py
          tests/test_r6_dual_revision_pg.py
