# FitX — tek EC2 üzerinde Docker Compose ile çalıştırma.
# Host üzerindeki nginx (bkz. nginx.conf) gelen istekleri 127.0.0.1:5000'e
# (web servisi) yönlendirir. Veritabanı artık AWS RDS PostgreSQL'dir (aynı VPC,
# private erişim); bağlantı .env'deki DATABASE_URL'den gelir. Bundled "db" servisi
# KALDIRILDI.
#
# ${VAR:-default} değerleri proje kökündeki .env dosyasından okunur
# (compose otomatik olarak .env'i değişken ikamesi için yükler).

services:
  web:
    build: .
    restart: unless-stopped
    # Tek EC2 host'unda bir Pillow/AI bellek sıçraması ya da kaçak süreç tüm
    # host'u OOM'a sürükleyip her şeyi düşürebilir. Servis başına bellek tavanı
    # koy (env ile override edilebilir — instance boyutuna göre ayarla).
    mem_limit: ${WEB_MEM_LIMIT:-1g}
    # Yalnızca loopback'e bağla — Flask doğrudan internete açık değil,
    # sadece host nginx reverse-proxy üzerinden erişilir.
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - .env
    # Log rotasyonu ZORUNLU. Varsayılan json-file sürücüsünün max-size'ı YOKTUR:
    # gunicorn --access-logfile - + observability.log_request istek BAŞINA satır
    # yazar, yani log dosyası sınırsız büyür. Tek EC2 host'unda sabit bir EBS
    # diskiyle bu, eninde sonunda diski doldurur ve web + redis + deploy'u BİRLİKTE
    # düşürür. mem_limit diskin dolmasına karşı hiçbir şey yapmaz.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Veritabanı: AWS RDS PostgreSQL. Bağlantı .env'deki DATABASE_URL'den gelir;
    # compose ARTIK override ETMEZ (önceden bundled "db" servisine yönlendiriyordu).
    # .env'de DATABASE_URL=postgresql://...rds.amazonaws.com:5432/... ZORUNLU;
    # prod'da eksikse uygulama BOOT'ta hata verir (artık sessiz SQLite fallback
    # YOK — bkz. app/config.py, 3.5). RDS dış/her zaman ayakta olduğu için web
    # yalnızca redis'e bağımlı.
    depends_on:
      redis:
        condition: service_healthy

  # Arka-plan iş worker'ı (Sprint 4 WS8). Aynı imaj, ayrı süreç: AI iş kuyruğunu
  # (fitx:ai) tüketir — konuşma özetleme gibi işler istek yolunu bloklamaz.
  # Worker düşse/olmasa da uygulama çalışır: işler satır-içine (inline) düşer
  # (app/jobs.enqueue_or_run). REDIS_URL .env'de zorunlu (prod'da zaten var).
  worker:
    build: .
    restart: unless-stopped
    command: python worker.py
    mem_limit: ${WORKER_MEM_LIMIT:-512m}
    env_file:
      - .env
    # web/redis ile aynı gerekçe: sınırsız log = dolu disk = tüm servisler düşer.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Worker'a KENDİ sağlık sözleşmesini ver. Aksi halde imaj düzeyindeki
    # HEALTHCHECK'i (web'e ait `http://127.0.0.1:5000/health`) miras alır — ama
    # worker `python worker.py` koşar ve 5000'de dinleyen HİÇBİR ŞEY yoktur, yani
    # her probe "Connection refused" ile düşer. Bu kalıcı yanlış-negatif gerçek bir
    # worker arızasını görünmez kılar (prod: failingstreak=988, restarts=0).
    # Kontrol yeni bir protokol icat etmez: worker.py'nin zaten yazdığı Redis
    # heartbeat'ini (fitx:worker:alive) mevcut app.jobs yardımcılarıyla okur.
    # start_period, worker'ın import + Redis bağlantısı + ilk heartbeat yazımı için;
    # heartbeat TTL/2'de bir (varsayılan 60s) tazelendiğinden interval 30s + retries
    # 3 bayat bir heartbeat'i, sağlıklı bir worker'ı yanlışlıkla düşürmeden yakalar.
    healthcheck:
      # `-m` ŞART: script'i yol ile çağırmak sys.path[0]'i /app/scripts yapar ve
      # `import app.jobs` ModuleNotFoundError verir. `-m` cwd'yi (WORKDIR /app)
      # sys.path'e koyar — uygulama paketi ancak böyle çözülür.
      test: ["CMD", "python", "-m", "scripts.worker_healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    depends_on:
      redis:
        condition: service_healthy

  redis:
    # Değişmez (immutable) üretim imajı: `redis:alpine` MUTABLE bir etiketti —
    # aynı uygulama SHA'sının iki deploy'u arasında sessizce farklı üçüncü-taraf
    # baytlara çözülebiliyordu. Sürüm + içerik digest'i birlikte sabitlenir
    # (Docker Hub çok-platformlu OCI index digest'i, redis 8.8.0-alpine).
    #
    # Major 8, major 7 DEĞİL: üretim hostu bu pin'den önce `redis:alpine`
    # çalıştırıyordu ve o etiket uzun süredir Redis 8'e çözülüyor. Kalıcı
    # volume'daki dump.rdb RDB format 14 ile yazılmış; Redis 7.4 onu
    # okuyamaz ("Can't handle RDB format version 14") ve açılışta ölür.
    # 7.4.11'e sabitlemek bu yüzden sessiz bir major DÜŞÜRME idi ve ilk
    # deploy'da fitx-redis'i restart döngüsüne soktu. 8.8.0 = hostta zaten
    # çalışan tam sürüm: veri taşıma yok, davranış değişikliği yok.
    image: redis:8.8.0-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    user: redis
    container_name: fitx-redis
    # web ile tutarlı: manuel stop'a saygı duy (önceden 'always' idi — 3.11).
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    # maxmemory + eviction olmadan leaderboard sorted-set'leri ve limiter depolaması
    # sınırsız büyüyüp host'u OOM'a sürükleyebilir. allkeys-lru: bellek dolunca en az
    # kullanılanı at — leaderboard Postgres'ten yeniden kurulabilir (kaynak Postgres),
    # limiter eviction'ı yalnızca rate-limit sayaçlarını sıfırlar (kabul edilebilir).
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    # Parola redis-server KOMUT SATIRINA KONMAZ (triage 2026-07-19 #7): argv,
    # host'taki ps / /proc/<pid>/cmdline ve docker inspect'te görünür. Başlangıçta
    # yalnızca redis kullanıcısının okuyabildiği (umask 077) geçici conf'a yazılır
    # ve dosyadan okunur; sır olmayan ayarlar argv'de kalabilir.
    command:
      - sh
      - -c
      - >-
        umask 077 &&
        printf 'requirepass "%s"\n' "$$REDIS_PASSWORD" > /tmp/requirepass.conf &&
        exec redis-server /tmp/requirepass.conf
        --maxmemory ${REDIS_MAXMEMORY:-200mb}
        --maxmemory-policy allkeys-lru --save 60 1
    # Sadece loopback'e bağla — uygulama compose ağından "redis:6379" ile erişir;
    # host eşlemesi yalnızca EC2 üzerinden redis-cli ile bakmak içindir, dışarı kapalı.
    ports:
      - "127.0.0.1:6379:6379"
    # web ile aynı gerekçe: sınırsız log = dolu disk = tüm servisler birden düşer.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # Konteyner silinse bile sorted-set verisi kalır (Postgres yine de kaynaktır).
      - redis_data:/data
    healthcheck:
      # Parola redis-cli argv'sine de KONMAZ (aynı sızıntı sınıfı) — REDISCLI_AUTH
      # ortam değişkeni redis-cli'nin resmi kimlik doğrulama yoludur.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  redis_data:
