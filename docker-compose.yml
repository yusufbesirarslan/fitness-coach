# FitX — tek EC2 üzerinde Docker Compose ile çalıştırma.
# Host üzerindeki nginx (bkz. nginx.conf) gelen istekleri 127.0.0.1:5000'e
# (web servisi) yönlendirir. db sadece compose ağı içinden erişilebilir.
#
# ${VAR:-default} değerleri proje kökündeki .env dosyasından okunur
# (compose otomatik olarak .env'i değişken ikamesi için yükler).

services:
  web:
    build: .
    restart: unless-stopped
    # Tek EC2 host'unda bir Pillow/AI bellek sıçraması ya da kaçak süreç tüm
    # host'u OOM'a sürükleyip her şeyi düşürebilir. Servis başına bellek tavanı
    # koy (env ile override edilebilir — instance boyutuna göre ayarla).
    mem_limit: ${WEB_MEM_LIMIT:-1g}
    # Yalnızca loopback'e bağla — Flask doğrudan internete açık değil,
    # sadece host nginx reverse-proxy üzerinden erişilir.
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - .env
    environment:
      # Compose içindeki Postgres'e bağlan; host'u "db" servis adı çözer.
      # .env'deki DATABASE_URL'i bilinçli olarak override ediyoruz ki
      # uygulama her zaman compose db'sine baksın.
      DATABASE_URL: postgresql://${POSTGRES_USER:-fitx}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-fitx}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:alpine
    container_name: fitx-redis
    restart: always
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    # maxmemory + eviction olmadan leaderboard sorted-set'leri ve limiter depolaması
    # sınırsız büyüyüp host'u OOM'a sürükleyebilir. allkeys-lru: bellek dolunca en az
    # kullanılanı at — leaderboard Postgres'ten yeniden kurulabilir (kaynak Postgres),
    # limiter eviction'ı yalnızca rate-limit sayaçlarını sıfırlar (kabul edilebilir).
    command: redis-server --maxmemory ${REDIS_MAXMEMORY:-200mb} --maxmemory-policy allkeys-lru --save 60 1
    # Sadece loopback'e bağla — uygulama compose ağından "redis:6379" ile erişir;
    # host eşlemesi yalnızca EC2 üzerinden redis-cli ile bakmak içindir, dışarı kapalı.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      # Konteyner silinse bile sorted-set verisi kalır (Postgres yine de kaynaktır).
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    mem_limit: ${DB_MEM_LIMIT:-512m}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fitx}
      # postgres:18+ varsayilan veri dizinini degistirdi: mount /var/lib/postgresql/data'da
      # olunca "unused mount/volume" hatasiyla boot patliyor. PGDATA'yi eski yola sabitleyip
      # mevcut mount'u koruyoruz (alternatif: mount'u /var/lib/postgresql'e tasimak).
      PGDATA: /var/lib/postgresql/data
    volumes:
      # Konteyner silinse bile veri kaybolmaz.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # web, db "healthy" olana kadar başlamaz; starter.py import sırasında
      # db.create_all() çağırdığı için Postgres hazır olmadan boot başarısız olur.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitx} -d ${POSTGRES_DB:-fitx}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
  redis_data:
