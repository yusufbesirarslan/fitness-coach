[Unit]
# Bound failed activations to twelve attempts in five minutes. With the
# ten-second delay below, a transient startup failure is retried for about
# 110 seconds before systemd leaves the unit failed for operator review.
StartLimitIntervalSec=300
StartLimitBurst=12

[Service]
# nginx -t resolves static upstream hostnames during ExecStartPre. Retry a
# failed activation after transient DNS becomes available again.
Restart=on-failure
RestartSec=10s
