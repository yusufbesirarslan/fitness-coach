# AxisAI web slot -> loopback backend mapping (R6-01 / P6).
# Installed root:root 0644 at /etc/axisai/web-slots.conf and read ONLY by
# /usr/local/sbin/axisai-switch-web-slot. Must match deploy/compose/web-slot-*.yml.
# Format: "<blue|green> 127.0.0.1:<port>"; loopback only, distinct ports.
blue 127.0.0.1:5001
green 127.0.0.1:5002
